# 申请证书前的临时站点：只开 80，给 certbot webroot 用。
# scripts/deploy.sh 在证书就绪后会换成 mm.wenfu.dev.conf。
server {
    listen 80;
    server_name mm.wenfu.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
