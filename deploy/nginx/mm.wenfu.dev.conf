# Markdown Mindmap — mm.wenfu.dev
# scripts/deploy.sh 安装到 /etc/nginx/sites-available/mm.wenfu.dev 并启用。
# 证书：certbot certonly --webroot -w /var/www/certbot -d mm.wenfu.dev
server {
    listen 443 ssl;
    server_name mm.wenfu.dev;

    root /var/www/mm.wenfu.dev;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/mm.wenfu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mm.wenfu.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(js|mjs|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

server {
    listen 80;
    server_name mm.wenfu.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
