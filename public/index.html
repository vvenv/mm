<style>

    margin: 0; padding: 0 4px; box-sizing: border-box;

<script type="module">
import {
  DOWNLOAD_FORMATS,
  buildDownload,
  captureState,
  cloneData,
  createHistory,
  createLocalStore,
  nodeAtPath,
  normalizeDownloadName,
  pageTitleOf,
  parseMarkdown,
  pathToNode,
  recognizeNodeTap,
  shouldConfirmOverwrite,
  toMarkdown,
} from "./mm-core.js?v=20261102g";

const store = createLocalStore();
const history = createHistory();
const DEMO = {
  title: "Markdown Mindmap",
  subtitle: "mm.wenfu.dev",
  open: true,
  children: [
    {
      title: "上传大纲",
      open: true,
      children: [
        { title: "# 标题 → 中心", children: [] },
        { title: "拖放导入前会确认覆盖", children: [] },
      ],
    },
    {
      title: "编辑节点",
      open: true,
      children: [
        { title: "双击行内编辑", children: [] },
        { title: "右键或长按出菜单", children: [] },
        { title: "Tab / Enter 快捷键", children: [] },
      ],
    },
    { title: "下载可选文件名与格式", children: [] },
  ],
};

let tree = null;
let fileName = "mindmap.md";
let selected = null;
let editing = false;
let editInput = null;
let ignoreBlur = false;
let lastTap = { node: null, time: 0 };
let pendingImportFile = null;
let editBaseline = null;
let longPressTimer = null;
let longPressArmed = false;
let suppressNextTap = false;

const NS = "http://www.w3.org/2000/svg";
const LONG_PRESS_MS = 520;
const svg = document.getElementById("map");
const viewport = document.createElementNS(NS, "g");
const toastEl = document.getElementById("toast");
const fileInput = document.getElementById("fileInput");
const ctxMenu = document.getElementById("ctxMenu");
const undoBtn = document.getElementById("undoBtn");
const redoBtn = document.getElementById("redoBtn");
const confirmModal = document.getElementById("confirmModal");
const confirmTitle = document.getElementById("confirmTitle");
const confirmText = document.getElementById("confirmText");
const confirmOk = document.getElementById("confirmOk");
const downloadModal = document.getElementById("downloadModal");
const downloadName = document.getElementById("downloadName");
const downloadFormat = document.getElementById("downloadFormat");
svg.appendChild(viewport);

const GAP_X = 56;
const GAP_Y = 18;
const song = '"Songti SC", "STSongti-SC-Regular", "Noto Serif SC", serif';
const sans = '"PingFang SC", "Hiragino Sans GB", sans-serif';
const styles = [
  { size: 30, weight: 700, family: song, fill: "#111", h: 46 },
  { size: 22, weight: 700, family: song, fill: "#111", h: 38 },
  { size: 17, weight: 600, family: song, fill: "#111", h: 34 },
  { size: 15, weight: 500, family: sans, fill: "#111", h: 30 },
  { size: 14, weight: 400, family: sans, fill: "#333", h: 28 },
];

DOWNLOAD_FORMATS.forEach((format) => {
  const option = document.createElement("option");
  option.value = format.id;
  option.textContent = format.available ? format.label : `${format.label}（即将支持）`;
  option.disabled = !format.available;
  if (format.available) option.selected = true;
  downloadFormat.appendChild(option);
});

function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function saveLocal() {
  store.save(fileName, tree);
}

function currentSnapshot() {
  return captureState(tree, fileName, selected);
}

function pushHistory() {
  history.push(currentSnapshot());
  updateHistoryChrome();
}

function updateHistoryChrome() {
  undoBtn.disabled = !history.canUndo();
  redoBtn.disabled = !history.canRedo();
}

function restoreSnapshot(snapshot) {
  if (!snapshot) return;
  if (editing) {
    editing = false;
    editInput = null;
    editBaseline = null;
  }
  tree = cloneData(snapshot.tree);
  fileName = snapshot.fileName || fileName;
  prepare(tree, true);
  selected = snapshot.selectedPath ? nodeAtPath(tree, snapshot.selectedPath) : null;
  document.title = pageTitleOf(tree) + " · mm";
  svg.setAttribute("aria-label", pageTitleOf(tree));
  frame();
  saveLocal();
  updateHistoryChrome();
}

function undo() {
  if (editing) commitEdit(true);
  if (!history.canUndo()) return;
  const previous = history.undo(currentSnapshot());
  restoreSnapshot(previous);
  toast("已撤销");
}

function redo() {
  if (editing) commitEdit(true);
  if (!history.canRedo()) return;
  const next = history.redo(currentSnapshot());
  restoreSnapshot(next);
  toast("已重做");
}

function walk(node, depth, visit) {
  visit(node, depth);
  node.children.forEach((child) => walk(child, depth + 1, visit));
}

function prepare(node, keepOpen) {
  walk(node, 0, (item, depth) => {
    item.depth = depth;
    if (!keepOpen || item.open === undefined) item.open = depth < 2;
  });
}

function refreshDepth(node, depth) {
  node.depth = depth;
  node.children.forEach((child) => refreshDepth(child, depth + 1));
}

function locate(target, node = tree, parent = null, index = -1) {
  if (node === target) return { node, parent, index };
  for (let i = 0; i < node.children.length; i++) {
    const found = locate(target, node.children[i], node, i);
    if (found) return found;
  }
  return null;
}

function updateChrome() {
  updateHistoryChrome();
  updateCtxMenuChrome();
}

function updateCtxMenuChrome() {
  const has = !!selected && !editing;
  const isRoot = selected === tree;
  ctxMenu.querySelector('[data-act="rename"]').disabled = !has;
  ctxMenu.querySelector('[data-act="child"]').disabled = !has;
  ctxMenu.querySelector('[data-act="sibling"]').disabled = !has || isRoot;
  ctxMenu.querySelector('[data-act="delete"]').disabled = !has || isRoot;
}

function selectNode(node) {
  if (editing) commitEdit(true);
  selected = node || null;
  updateChrome();
  draw();
}

const measureCanvas = document.createElement("canvas").getContext("2d");
function textWidth(text, font) {
  measureCanvas.font = font;
  return Math.ceil(measureCanvas.measureText(text).width);
}

function layout(node) {
  const depth = Math.min(node.depth, styles.length - 1);
  node.style = styles[depth];
  node.h = node.style.h;
  const title = editing && node === selected && editInput
    ? (editInput.value || " ")
    : (node.title || " ");
  node.labelW = textWidth(title, node.style.weight + " " + node.style.size + "px " + node.style.family);
  node.hasChildren = node.children.length > 0;
  node.marker = node.hasChildren && !node.open ? node.children.length : 0;
  node.markerW = node.hasChildren ? 24 + (node.marker ? textWidth(String(node.marker), "400 13px " + sans) + 8 : 0) : 0;
  node.w = node.labelW + node.markerW;
  if (!node.open || !node.hasChildren) {
    node.subtreeH = node.h;
    return;
  }
  node.children.forEach(layout);
  const inner = node.children.reduce((sum, child) => sum + child.subtreeH, 0) + GAP_Y * (node.children.length - 1);
  node.subtreeH = Math.max(node.h, inner);
}

function place(node, x, top) {
  node.x = x;
  if (!node.open || !node.hasChildren) {
    node.y = top + (node.subtreeH - node.h) / 2;
    return;
  }
  const inner = node.children.reduce((sum, child) => sum + child.subtreeH, 0) + GAP_Y * (node.children.length - 1);
  let y = top + (node.subtreeH - inner) / 2;
  node.children.forEach((child) => {
    place(child, x + node.w + GAP_X, y);
    y += child.subtreeH + GAP_Y;
  });
  const first = node.children[0];
  const last = node.children[node.children.length - 1];
  const mid = (first.y + first.h / 2 + last.y + last.h / 2) / 2;
  node.y = mid - node.h / 2;
}

let tx = 48;
let ty = 36;
let scale = 1;

function screenPoint(x, y) {
  return { x: tx + x * scale, y: ty + y * scale };
}

function hideCtxMenu() {
  ctxMenu.classList.remove("show");
}

function isSecondaryPointer(event) {
  return event.button === 2 || (event.button === 0 && event.ctrlKey);
}

function showCtxMenu(clientX, clientY, node) {
  if (!node || editing) return;
  clearLongPress();
  if (selected !== node) {
    selected = node;
    lastTap = { node: null, time: 0 };
    draw();
  } else {
    updateChrome();
  }
  updateCtxMenuChrome();
  ctxMenu.classList.add("show");
  const pad = 8;
  const width = ctxMenu.offsetWidth || 180;
  const height = ctxMenu.offsetHeight || 180;
  let left = clientX;
  let top = clientY;
  if (left + width > window.innerWidth - pad) left = window.innerWidth - width - pad;
  if (top + height > window.innerHeight - pad) top = window.innerHeight - height - pad;
  if (left < pad) left = pad;
  if (top < pad) top = pad;
  ctxMenu.style.left = `${left}px`;
  ctxMenu.style.top = `${top}px`;
}

function nodeFromEventTarget(target) {
  const host = target && target.closest && target.closest("[data-node-path]");
  if (!host) return null;
  const raw = host.getAttribute("data-node-path");
  if (raw === "") return tree;
  return nodeAtPath(tree, raw.split(",").map(Number));
}

function clearLongPress() {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
  longPressArmed = false;
}

function draw() {
  const activeValue = editing && editInput ? editInput.value : null;
  const selectionStart = editing && editInput ? editInput.selectionStart : null;
  const selectionEnd = editing && editInput ? editInput.selectionEnd : null;

  viewport.replaceChildren();
  const links = document.createElementNS(NS, "g");
  const nodes = document.createElementNS(NS, "g");
  viewport.append(links, nodes);

  function visit(node) {
    if (!node.style) return;
    if (node.open) {
      node.children.forEach((child) => {
        if (!child.style) return;
        const x1 = node.x + node.w;
        const y1 = node.y + node.h / 2;
        const x2 = child.x;
        const y2 = child.y + child.h / 2;
        const bend = Math.max(20, (x2 - x1) * 0.46);
        const path = document.createElementNS(NS, "path");
        path.setAttribute("d", "M " + x1 + " " + y1 + " C " + (x1 + bend) + " " + y1 + ", " + (x2 - bend) + " " + y2 + ", " + x2 + " " + y2);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#111");
        path.setAttribute("stroke-width", node.depth === 0 ? 1.6 : 1);
        links.appendChild(path);
        visit(child);
      });
    }

    const group = document.createElementNS(NS, "g");
    group.style.cursor = "pointer";
    const nodePath = pathToNode(tree, node);
    group.setAttribute("data-node-path", nodePath ? nodePath.join(",") : "");
    const isEditingNode = editing && node === selected;

    if (node === selected || isEditingNode) {
      const sel = document.createElementNS(NS, "rect");
      sel.setAttribute("x", node.x - 10);
      sel.setAttribute("y", node.y + 2);
      sel.setAttribute("width", Math.max(node.labelW, 48) + 20);
      sel.setAttribute("height", node.h - 4);
      sel.setAttribute("rx", 4);
      sel.setAttribute("fill", "#f0f0f0");
      group.appendChild(sel);
    }

    if (!isEditingNode) {
      const hit = document.createElementNS(NS, "rect");
      hit.setAttribute("x", node.x - 8);
      hit.setAttribute("y", node.y);
      hit.setAttribute("width", Math.max(node.labelW, 12) + 8);
      hit.setAttribute("height", node.h);
      hit.setAttribute("fill", "transparent");
      group.appendChild(hit);

      const label = document.createElementNS(NS, "text");
      label.setAttribute("x", node.x);
      label.setAttribute("y", node.y + node.h / 2);
      label.setAttribute("dominant-baseline", "central");
      label.setAttribute("fill", node.style.fill);
      label.setAttribute("font-family", node.style.family);
      label.setAttribute("font-size", node.style.size);
      label.setAttribute("font-weight", node.style.weight);
      label.textContent = node.title;
      group.appendChild(label);
    } else {
      const fo = document.createElementNS(NS, "foreignObject");
      const editW = Math.max(node.labelW + 28, 72);
      fo.setAttribute("x", node.x - 6);
      fo.setAttribute("y", node.y + 4);
      fo.setAttribute("width", editW);
      fo.setAttribute("height", node.h - 8);
      const input = document.createElement("input");
      input.className = "inline-edit";
      input.type = "text";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.value = activeValue != null ? activeValue : node.title;
      input.style.fontFamily = node.style.family;
      input.style.fontSize = node.style.size + "px";
      input.style.fontWeight = node.style.weight;
      fo.appendChild(input);
      group.appendChild(fo);
      editInput = input;

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          commitEdit(true);
        } else if (event.key === "Escape") {
          event.preventDefault();
          commitEdit(false);
        } else if (event.key === "Tab") {
          event.preventDefault();
          commitEdit(true);
          addChild(selected);
        }
      });
      input.addEventListener("input", () => {
        const value = input.value || " ";
        node.labelW = textWidth(value, node.style.weight + " " + node.style.size + "px " + node.style.family);
        fo.setAttribute("width", Math.max(node.labelW + 28, 72));
      });
      input.addEventListener("blur", () => {
        if (ignoreBlur) return;
        commitEdit(true);
      });

      requestAnimationFrame(() => {
        if (!editInput) return;
        editInput.focus();
        if (selectionStart != null && selectionEnd != null) {
          try { editInput.setSelectionRange(selectionStart, selectionEnd); }
          catch (_) { editInput.select(); }
        } else {
          editInput.select();
        }
      });
    }

    if (node.hasChildren) {
      const mx = node.x + (isEditingNode ? Math.max(node.labelW, 48) + 20 : node.labelW) + 16;
      const my = node.y + node.h / 2;
      const mark = document.createElementNS(NS, "circle");
      mark.setAttribute("cx", mx);
      mark.setAttribute("cy", my);
      mark.setAttribute("r", 7);
      mark.setAttribute("fill", "#fff");
      mark.setAttribute("stroke", "#111");
      mark.setAttribute("stroke-width", 1.2);
      group.appendChild(mark);
      const hline = document.createElementNS(NS, "path");
      hline.setAttribute("d", "M " + (mx - 3.2) + " " + my + " H " + (mx + 3.2));
      hline.setAttribute("stroke", "#111");
      hline.setAttribute("stroke-width", 1.2);
      hline.setAttribute("fill", "none");
      group.appendChild(hline);
      if (!node.open) {
        const vline = document.createElementNS(NS, "path");
        vline.setAttribute("d", "M " + mx + " " + (my - 3.2) + " V " + (my + 3.2));
        vline.setAttribute("stroke", "#111");
        vline.setAttribute("stroke-width", 1.2);
        vline.setAttribute("fill", "none");
        group.appendChild(vline);
      }
      if (node.marker) {
        const count = document.createElementNS(NS, "text");
        count.setAttribute("x", mx + 14);
        count.setAttribute("y", my);
        count.setAttribute("dominant-baseline", "central");
        count.setAttribute("fill", "#888");
        count.setAttribute("font-family", sans);
        count.setAttribute("font-size", 13);
        count.setAttribute("font-weight", 400);
        count.textContent = String(node.marker);
        group.appendChild(count);
      }
      if (!isEditingNode) {
        const markHit = document.createElementNS(NS, "circle");
        markHit.setAttribute("cx", mx);
        markHit.setAttribute("cy", my);
        markHit.setAttribute("r", 12);
        markHit.setAttribute("fill", "transparent");
        markHit.style.cursor = "pointer";
        markHit.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
          if (isSecondaryPointer(event)) return;
          armDrag(event, node, "toggle");
        });
        group.appendChild(markHit);
      }
    }

    if (!isEditingNode) {
      group.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        if (isSecondaryPointer(event)) return;
        armDrag(event, node, "select");
        if (event.pointerType === "touch") {
          clearLongPress();
          longPressArmed = true;
          const x = event.clientX;
          const y = event.clientY;
          longPressTimer = setTimeout(() => {
            if (!longPressArmed || (drag && drag.moved)) return;
            longPressArmed = false;
            longPressTimer = null;
            suppressNextTap = true;
            drag = null;
            svg.classList.remove("dragging");
            try { svg.releasePointerCapture(event.pointerId); } catch (_) {}
            showCtxMenu(x, y, node);
          }, LONG_PRESS_MS);
        }
      });
    }
    nodes.appendChild(group);
  }

  visit(tree);
  apply();
  updateChrome();
}

function apply() {
  viewport.setAttribute("transform", "translate(" + tx + " " + ty + ") scale(" + scale + ")");
}

function relayout(anchor) {
  const before = anchor ? anchor.y : 0;
  layout(tree);
  place(tree, 0, 0);
  if (anchor && anchor.y != null) ty += (before - anchor.y) * scale;
  draw();
}

let drag = null;
function armDrag(event, node, mode) {
  if (editing) return;
  if (isSecondaryPointer(event)) return;
  hideCtxMenu();
  drag = { x: event.clientX, y: event.clientY, tx, ty, moved: false, node, mode, pointerId: event.pointerId };
  svg.setPointerCapture(event.pointerId);
}
svg.addEventListener("pointerdown", (event) => {
  if (editing) return;
  if (isSecondaryPointer(event)) return;
  if (!event.target.closest || !event.target.closest("[data-node-path]")) hideCtxMenu();
  armDrag(event, null, "pan");
});
svg.addEventListener("pointermove", (event) => {
  if (!drag || editing) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  clearLongPress();
  hideCtxMenu();
  svg.classList.add("dragging");
  tx = drag.tx + dx;
  ty = drag.ty + dy;
  apply();
});
function endDrag() {
  clearLongPress();
  if (suppressNextTap) {
    suppressNextTap = false;
    drag = null;
    svg.classList.remove("dragging");
    return;
  }
  if (drag && !drag.moved && drag.node) {
    if (drag.mode === "toggle") {
      lastTap = { node: null, time: 0 };
      hideCtxMenu();
      drag.node.open = !drag.node.open;
      selected = drag.node;
      relayout(drag.node);
      saveLocal();
    } else if (drag.mode === "select") {
      const result = recognizeNodeTap(lastTap, drag.node, Date.now());
      lastTap = result.next;
      if (result.action === "edit") {
        hideCtxMenu();
        beginEdit(drag.node);
      } else {
        selected = drag.node;
        draw();
      }
    }
  } else if (drag && !drag.moved && !drag.node) {
    lastTap = { node: null, time: 0 };
    selected = null;
    hideCtxMenu();
    draw();
  }
  drag = null;
  svg.classList.remove("dragging");
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", () => {
  clearLongPress();
  drag = null;
  svg.classList.remove("dragging");
});
svg.addEventListener("contextmenu", (event) => {
  event.preventDefault();
  const node = nodeFromEventTarget(event.target);
  if (!node) {
    hideCtxMenu();
    return;
  }
  showCtxMenu(event.clientX, event.clientY, node);
});
svg.addEventListener("wheel", (event) => {
  if (editing) return;
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) {
    const next = Math.min(2.4, Math.max(0.35, scale * (event.deltaY < 0 ? 1.08 : 0.92)));
    const rect = svg.getBoundingClientRect();
    const px = event.clientX - rect.left;
    const py = event.clientY - rect.top;
    tx = px - ((px - tx) * next) / scale;
    ty = py - ((py - ty) * next) / scale;
    scale = next;
  } else {
    tx -= event.deltaX;
    ty -= event.deltaY;
  }
  apply();
}, { passive: false });

function bounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  (function scan(node) {
    if (!node.style) return;
    minX = Math.min(minX, node.x);
    minY = Math.min(minY, node.y);
    maxX = Math.max(maxX, node.x + node.w);
    maxY = Math.max(maxY, node.y + node.h);
    if (node.open) node.children.forEach(scan);
  })(tree);
  return { minX, minY, w: maxX - minX, h: maxY - minY };
}

function frame() {
  layout(tree);
  place(tree, 0, 0);
  const box = bounds();
  const pad = 40;
  const fitW = (window.innerWidth - pad * 2) / Math.max(box.w, 1);
  const fitH = (window.innerHeight - pad * 2) / Math.max(box.h, 1);
  const fit = Math.min(fitW, fitH);
  scale = Math.min(1, Number.isFinite(fit) ? (fit >= 0.78 ? fit : fitW) : 1);
  if (!Number.isFinite(scale) || scale <= 0) scale = 1;
  tx = (window.innerWidth - box.w * scale) / 2 - box.minX * scale;
  const fittedH = box.h * scale;
  ty = fittedH < window.innerHeight - pad
    ? (window.innerHeight - fittedH) / 2 - box.minY * scale
    : window.innerHeight / 2 - (tree.y + tree.h / 2) * scale;
  draw();
}

function beginEdit(node) {
  if (!node) return;
  hideCtxMenu();
  if (editing && selected === node) {
    editInput && editInput.focus();
    return;
  }
  if (editing) commitEdit(true);
  selected = node;
  editing = true;
  editInput = null;
  editBaseline = currentSnapshot();
  layout(tree);
  place(tree, 0, 0);
  draw();
}

function commitEdit(save) {
  if (!editing) return;
  const node = selected;
  const value = editInput ? editInput.value.replace(/\s+/g, " ").trim() : (node && node.title);
  const nextTitle = value || "未命名";
  const baselineNode = editBaseline
    ? (editBaseline.selectedPath && editBaseline.selectedPath.length
      ? nodeAtPath(editBaseline.tree, editBaseline.selectedPath)
      : editBaseline.tree)
    : null;
  const changed = !!(save && node && baselineNode && nextTitle !== baselineNode.title);
  ignoreBlur = true;
  editing = false;
  editInput = null;
  if (save && node) {
    if (changed && editBaseline) history.push(editBaseline);
    node.title = nextTitle;
    if (node === tree) {
      document.title = pageTitleOf(tree) + " · mm";
      svg.setAttribute("aria-label", pageTitleOf(tree));
    }
  }
  editBaseline = null;
  relayout(node);
  saveLocal();
  updateHistoryChrome();
  requestAnimationFrame(() => { ignoreBlur = false; });
}

function addChild(parent) {
  if (!parent) return;
  if (editing) commitEdit(true);
  pushHistory();
  const child = { title: "新节点", children: [], open: true, depth: (parent.depth || 0) + 1 };
  parent.children.push(child);
  parent.open = true;
  refreshDepth(tree, 0);
  selected = child;
  editing = true;
  editInput = null;
  editBaseline = currentSnapshot();
  layout(tree);
  place(tree, 0, 0);
  draw();
  saveLocal();
}

function addSibling(node) {
  const info = locate(node);
  if (!info || !info.parent) return;
  if (editing) commitEdit(true);
  pushHistory();
  const sibling = { title: "新节点", children: [], open: true };
  info.parent.children.splice(info.index + 1, 0, sibling);
  refreshDepth(tree, 0);
  selected = sibling;
  editing = true;
  editInput = null;
  editBaseline = currentSnapshot();
  layout(tree);
  place(tree, 0, 0);
  draw();
  saveLocal();
}

function deleteNode(node) {
  const info = locate(node);
  if (!info || !info.parent) {
    toast("不能删除中心节点");
    return;
  }
  if (editing) commitEdit(true);
  hideCtxMenu();
  pushHistory();
  const parent = info.parent;
  parent.children.splice(info.index, 1);
  refreshDepth(tree, 0);
  selected = parent;
  relayout(parent);
  saveLocal();
}

ctxMenu.addEventListener("pointerdown", (event) => {
  event.stopPropagation();
  ignoreBlur = true;
});
ctxMenu.addEventListener("click", (event) => {
  const btn = event.target.closest("button[data-act]");
  if (!btn || btn.disabled) return;
  event.stopPropagation();
  const act = btn.getAttribute("data-act");
  hideCtxMenu();
  if (act === "rename") beginEdit(selected);
  if (act === "child") addChild(selected);
  if (act === "sibling") addSibling(selected);
  if (act === "delete") deleteNode(selected);
  requestAnimationFrame(() => { ignoreBlur = false; });
});

undoBtn.addEventListener("click", undo);
redoBtn.addEventListener("click", redo);

window.addEventListener("keydown", (event) => {
  if (confirmModal.classList.contains("show") || downloadModal.classList.contains("show")) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeConfirm(false);
      closeDownload();
    }
    return;
  }
  const mod = event.metaKey || event.ctrlKey;
  if (mod && event.key.toLowerCase() === "z") {
    event.preventDefault();
    if (event.shiftKey) redo();
    else undo();
    return;
  }
  if (mod && event.key.toLowerCase() === "y") {
    event.preventDefault();
    redo();
    return;
  }
  if (editing) return;
  const tag = event.target && event.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || event.target.isContentEditable) return;
  if (!selected && event.key !== "Escape") return;
  if (event.key === "Tab") {
    event.preventDefault();
    addChild(selected);
  } else if (event.key === "Enter") {
    event.preventDefault();
    if (selected === tree) addChild(selected);
    else addSibling(selected);
  } else if (event.key === "F2") {
    event.preventDefault();
    beginEdit(selected);
  } else if (event.key === "Backspace" || event.key === "Delete") {
    event.preventDefault();
    deleteNode(selected);
  } else if (event.key === "Escape") {
    hideCtxMenu();
    selected = null;
    draw();
  }
});

function loadTree(next, name, keepOpen, { recordHistory = false } = {}) {
  if (editing) {
    editing = false;
    editInput = null;
    editBaseline = null;
  }
  if (recordHistory) pushHistory();
  tree = next;
  selected = null;
  if (name) fileName = name.replace(/\.markdown$/i, ".md");
  prepare(tree, keepOpen);
  const title = pageTitleOf(tree);
  document.title = title + " · mm";
  svg.setAttribute("aria-label", title);
  frame();
  saveLocal();
  updateHistoryChrome();
}

function openConfirm(file) {
  pendingImportFile = file;
  confirmTitle.textContent = "覆盖当前导图？";
  confirmText.textContent = `导入「${file.name || "Markdown"}」将替换当前导图。可之后撤销。`;
  confirmOk.textContent = "覆盖导入";
  confirmModal.classList.add("show");
}

function closeConfirm(confirmed) {
  confirmModal.classList.remove("show");
  const file = pendingImportFile;
  pendingImportFile = null;
  if (confirmed && file) doImport(file);
}

async function doImport(file) {
  try {
    const text = await file.text();
    loadTree(parseMarkdown(text), file.name || "outline.md", false, { recordHistory: true });
    toast("已导入 " + (file.name || "Markdown"));
  } catch (error) {
    toast(error.message || String(error));
  }
}

async function requestImport(file) {
  if (!file) return;
  if (!/\.(md|markdown|txt)$/i.test(file.name || "") && file.type && !/^text\//.test(file.type)) {
    toast("请选择 Markdown 文本文件");
    return;
  }
  if (shouldConfirmOverwrite(tree)) openConfirm(file);
  else doImport(file);
}

function openDownload() {
  if (editing) commitEdit(true);
  downloadName.value = (fileName || tree.title || "mindmap").replace(/\.(md|markdown|txt|html|xmind)$/i, "");
  downloadFormat.value = "markdown";
  downloadModal.classList.add("show");
  downloadName.focus();
  downloadName.select();
}

function closeDownload() {
  downloadModal.classList.remove("show");
}

function confirmDownload() {
  try {
    const packed = buildDownload(tree, downloadFormat.value, downloadName.value);
    const blob = new Blob([packed.content], { type: packed.mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = packed.filename;
    a.click();
    URL.revokeObjectURL(url);
    fileName = packed.filename;
    saveLocal();
    closeDownload();
    toast("已下载 " + packed.filename);
  } catch (error) {
    toast(error.message || String(error));
  }
}

document.getElementById("uploadBtn").addEventListener("click", () => fileInput.click());
document.getElementById("downloadBtn").addEventListener("click", openDownload);
const help = document.getElementById("help");
const helpBtn = document.getElementById("helpBtn");
function setHelpOpen(open) {
  help.classList.toggle("open", open);
  helpBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
helpBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  setHelpOpen(!help.classList.contains("open"));
});
window.addEventListener("pointerdown", (event) => {
  if (!help.classList.contains("open")) return;
  if (help.contains(event.target)) return;
  setHelpOpen(false);
});
window.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && help.classList.contains("open")) setHelpOpen(false);
}, true);
document.getElementById("confirmCancel").addEventListener("click", () => closeConfirm(false));
document.getElementById("confirmOk").addEventListener("click", () => closeConfirm(true));
document.getElementById("downloadCancel").addEventListener("click", closeDownload);
document.getElementById("downloadOk").addEventListener("click", confirmDownload);
downloadName.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    confirmDownload();
  }
});
fileInput.addEventListener("change", () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = "";
  requestImport(file);
});

let dragDepth = 0;
window.addEventListener("dragenter", (event) => {
  event.preventDefault();
  dragDepth += 1;
  document.body.classList.add("dragging-file");
});
window.addEventListener("dragover", (event) => event.preventDefault());
window.addEventListener("dragleave", (event) => {
  event.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) document.body.classList.remove("dragging-file");
});
window.addEventListener("drop", (event) => {
  event.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging-file");
  const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
  requestImport(file);
});

confirmModal.addEventListener("click", (event) => {
  if (event.target === confirmModal) closeConfirm(false);
});
downloadModal.addEventListener("click", (event) => {
  if (event.target === downloadModal) closeDownload();
});

const cached = store.load();
if (cached) {
  tree = cached.tree;
  fileName = cached.fileName || "mindmap.md";
  prepare(tree, true);
  document.title = pageTitleOf(tree) + " · mm";
  svg.setAttribute("aria-label", pageTitleOf(tree));
} else {
  tree = cloneData(DEMO);
  prepare(tree, true);
}
frame();
window.addEventListener("pointerdown", (event) => {
  if (!ctxMenu.classList.contains("show")) return;
  if (ctxMenu.contains(event.target)) return;
  hideCtxMenu();
});

window.addEventListener("resize", () => {
  hideCtxMenu();
  if (!editing) frame();
});

window.__mm = {
  recognizeNodeTap,
  shouldConfirmOverwrite,
  normalizeDownloadName,
  buildDownload,
  getTree: () => tree,
  getSelected: () => selected,
  isEditing: () => editing,
  canUndo: () => history.canUndo(),
  canRedo: () => history.canRedo(),
  undo,
  redo,
  beginEdit: (node) => beginEdit(node || selected),
  doubleTap: (node) => {
    const target = node || selected || tree;
    const first = recognizeNodeTap(null, target, Date.now());
    lastTap = first.next;
    selected = target;
    draw();
    const second = recognizeNodeTap(lastTap, target, Date.now());
    lastTap = second.next;
    if (second.action === "edit") beginEdit(target);
    return second.action;
  },
};
</script>
