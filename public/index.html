            icon: "🖐️",
            children: [
              { title: "拖动平移", children: [] },
              { title: "⌘/Ctrl + 滚轮缩放", children: [] },
              { title: "⌘/Ctrl + +/- 缩放", children: [] },
              { title: "⌘/Ctrl + 0 适应画布", children: [] },
              { title: "手机双指捏合缩放", children: [] },
            ],
          },
        ],
      };

      let tree = null;
      let fileName = "mindmap.md";
      let selected = null;
      let editing = false;
      let editField = "title";
      let editInput = null;
      let ignoreBlur = false;
      let appMode = readAppMode();
      let fontId = readFontId();
      let pendingConfirm = null;
      let editBaseline = null;
      let longPressTimer = null;
      let longPressArmed = false;
      let suppressNextTap = false;
      let noteNode = null;
      let noteEditing = false;
      let noteBaseline = null;
      let iconNode = null;
      let iconTabId = "recent";
      let iconQuery = "";

      const NS = "http://www.w3.org/2000/svg";
      const LONG_PRESS_MS = 520;
      const svg = document.getElementById("map");
      const viewport = document.createElementNS(NS, "g");
      const toastEl = document.getElementById("toast");
      const fileInput = document.getElementById("fileInput");
      const ctxMenu = document.getElementById("ctxMenu");
      const undoBtn = document.getElementById("undoBtn");
      const uploadBtn = document.getElementById("uploadBtn");
      const closeDocBtn = document.getElementById("closeDocBtn");
      const modeSwitch = document.getElementById("modeSwitch");
      const fontSelect = document.getElementById("fontSelect");
      const redoBtn = document.getElementById("redoBtn");
      const confirmModal = document.getElementById("confirmModal");
      const confirmTitle = document.getElementById("confirmTitle");
      const confirmText = document.getElementById("confirmText");
      const confirmOk = document.getElementById("confirmOk");
      const downloadModal = document.getElementById("downloadModal");
      const downloadName = document.getElementById("downloadName");
      const downloadFormat = document.getElementById("downloadFormat");
      const notePop = document.getElementById("notePop");
      const noteView = document.getElementById("noteView");
      const noteEdit = document.getElementById("noteEdit");
      const noteFoot = document.getElementById("noteFoot");
      const iconPop = document.getElementById("iconPop");
      const iconTabs = document.getElementById("iconTabs");
      const iconGrid = document.getElementById("iconGrid");
      const iconSearch = document.getElementById("iconSearch");
      svg.appendChild(viewport);

      const GAP_X = 56;
      const GAP_Y = 18;
      const DESC_SIZE = 13;
      const DESC_GAP = 4;
      const NOTE_ICON_W = 22;
      const NODE_ICON_W = 26;
      const ICON_TABS = [
        { id: "recent", label: "最近" },
        ...EMOJI_CATEGORIES.map((c) => ({ id: c.id, label: c.label })),
      ];
      let sans;
      let styles;

      function applyFont(nextId, { persist = true, announce = false } = {}) {
        fontId = normalizeFontId(nextId);
        const stacks = fontStacksFor(fontId);
        sans = stacks.body;
        styles = buildLevelStyles(fontId);
        document.documentElement.style.setProperty("--font-body", stacks.body);
        document.documentElement.style.setProperty("--font-title", stacks.title);
        fontSelect.value = fontId;
        if (persist) writeFontId(fontId);
        if (editing) commitEdit(true);
        if (tree) {
          layout(tree);
          place(tree, 0, 0);
          draw();
        }
        if (announce) {
          const preset = FONT_PRESETS.find((item) => item.id === fontId);
          toast(`字体：${preset ? preset.label : "默认"}`);
        }
      }

      FONT_PRESETS.forEach((preset) => {
        const option = document.createElement("option");
        option.value = preset.id;
        option.textContent = preset.label;
        fontSelect.appendChild(option);
      });
      applyFont(fontId, { persist: false });

      function descText(node) {
        return node && node.desc ? String(node.desc).trim() : "";
      }

      function nodeShowsSubtitle(node) {
        if (!node) return false;
        if (descText(node)) return true;
        return editing && selected === node && editField === "desc";
      }

      function noteText(node) {
        return node && node.note != null ? String(node.note) : "";
      }

      function nodeHasNote(node) {
        return !!(node && String(node.note || "").trim());
      }

      function iconText(node) {
        return node && node.icon ? String(node.icon).trim() : "";
      }

      DOWNLOAD_FORMATS.forEach((format) => {
        const option = document.createElement("option");
        option.value = format.id;
        option.textContent = format.available
          ? format.label
          : `${format.label}（即将支持）`;
        option.disabled = !format.available;
        if (format.available) option.selected = true;
        downloadFormat.appendChild(option);
      });

      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toastEl.classList.remove("show"), 2200);
      }

      function saveLocal() {
        store.save(fileName, tree);
      }

      function currentSnapshot() {
        return captureState(tree, fileName, selected);
      }

      function pushHistory() {
        history.push(currentSnapshot());
        updateHistoryChrome();
      }

      function canEdit() {
        return appMode === "edit";
      }

      function syncModeSwitch() {
        document.body.dataset.mode = appMode;
        modeSwitch.querySelectorAll("[data-mode]").forEach((btn) => {
          const on = btn.getAttribute("data-mode") === appMode;
          btn.setAttribute("aria-checked", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
        });
        uploadBtn.disabled = !canEdit();
        uploadBtn.title = canEdit() ? "导入 Markdown" : "只读模式下不能导入";
        closeDocBtn.disabled = !canEdit();
        closeDocBtn.title = canEdit() ? "关闭文档" : "只读模式下不能关闭文档";
        undoBtn.title = canEdit() ? "撤销 ⌘Z" : "只读模式下不能撤销";
        redoBtn.title = canEdit() ? "重做 ⌘⇧Z" : "只读模式下不能重做";
      }

      function setAppMode(mode) {
        const next = mode === "view" ? "view" : "edit";
        if (next === appMode) return;
        appMode = next;
        writeAppMode(appMode);
        if (!canEdit()) {
          if (editing) commitEdit(true);
          if (noteEditing) commitNote(true);
          hideCtxMenu();
          hideIconPop();
          if (confirmModal.classList.contains("show")) closeConfirm(false);
          document.body.classList.remove("dragging-file");
        } else if (
          notePop.classList.contains("show") &&
          noteNode &&
          !noteEditing
        ) {
          noteEditing = true;
          noteBaseline = currentSnapshot();
          syncNotePopContent();
          requestAnimationFrame(() => {
            noteEdit.focus();
            noteEdit.setSelectionRange(
              noteEdit.value.length,
              noteEdit.value.length,
            );
          });
        }
        syncModeSwitch();
        updateChrome();
        if (!editing) draw();
      }

      function setFont(nextId) {
        applyFont(nextId, { persist: true, announce: true });
      }

      function updateHistoryChrome() {
        undoBtn.disabled = !canEdit() || !history.canUndo();
        redoBtn.disabled = !canEdit() || !history.canRedo();
      }

      function restoreSnapshot(snapshot) {
        if (!snapshot) return;
        if (editing) {
          editing = false;
          editInput = null;
          editBaseline = null;
        }
        tree = cloneData(snapshot.tree);
        fileName = snapshot.fileName || fileName;
        prepare(tree, true);
        selected = snapshot.selectedPath
          ? nodeAtPath(tree, snapshot.selectedPath)
          : null;
        document.title = pageTitleOf(tree) + " · mm";
        svg.setAttribute("aria-label", pageTitleOf(tree));
        frame();
        saveLocal();
        updateHistoryChrome();
      }

      function undo() {
        if (!canEdit()) return;
        if (editing) commitEdit(true);
        if (!history.canUndo()) return;
        const previous = history.undo(currentSnapshot());
        restoreSnapshot(previous);
        toast("已撤销");
      }

      function redo() {
        if (!canEdit()) return;
        if (editing) commitEdit(true);
        if (!history.canRedo()) return;
        const next = history.redo(currentSnapshot());
        restoreSnapshot(next);
        toast("已重做");
      }

      function walk(node, depth, visit) {
        visit(node, depth);
        node.children.forEach((child) => walk(child, depth + 1, visit));
      }

      function prepare(node, keepOpen) {
        walk(node, 0, (item, depth) => {
          item.depth = depth;
          if (!keepOpen || item.open === undefined) item.open = depth < 2;
        });
      }

      function refreshDepth(node, depth) {
        node.depth = depth;
        node.children.forEach((child) => refreshDepth(child, depth + 1));
      }

      function locate(target, node = tree, parent = null, index = -1) {
        if (node === target) return { node, parent, index };
        for (let i = 0; i < node.children.length; i++) {
          const found = locate(target, node.children[i], node, i);
          if (found) return found;
        }
        return null;
      }

      function updateChrome() {
        updateHistoryChrome();
        updateCtxMenuChrome();
      }

      function updateCtxMenuChrome() {
        const has = !!selected && !editing && canEdit();
        const isRoot = selected === tree;
        ctxMenu.querySelector('[data-act="rename"]').disabled = !has;
        ctxMenu.querySelector('[data-act="desc"]').disabled = !has;
        ctxMenu.querySelector('[data-act="note"]').disabled = !has;
        ctxMenu.querySelector('[data-act="child"]').disabled = !has;
        ctxMenu.querySelector('[data-act="sibling"]').disabled = !has || isRoot;
        ctxMenu.querySelector('[data-act="delete"]').disabled = !has || isRoot;
      }

      function selectNode(node) {
        if (editing) commitEdit(true);
        selected = node || null;
        updateChrome();
        draw();
      }

      const measureCanvas = document.createElement("canvas").getContext("2d");
      function textWidth(text, font) {
        measureCanvas.font = font;
        return Math.ceil(measureCanvas.measureText(text).width);
      }

      function layout(node) {
        const depth = Math.min(node.depth, styles.length - 1);
        node.style = styles[depth];
        const editingHere = editing && node === selected && editInput;
        const title =
          editingHere && editField === "title"
            ? editInput.value || " "
            : node.title || " ";
        const desc =
          editingHere && editField === "desc"
            ? editInput.value || ""
            : descText(node);
        // Only grow height when subtitle text exists — empty desc edit overlays
        // without shifting sibling layout on activate.
        const showSub = !!desc;
        node.labelW = textWidth(
          title,
          node.style.weight + " " + node.style.size + "px " + node.style.family,
        );
        if (showSub) {
          const subW = textWidth(
            desc || " ",
            "400 " + DESC_SIZE + "px " + sans,
          );
          node.labelW = Math.max(node.labelW, subW);
          node.h = node.style.h + DESC_SIZE + DESC_GAP;
        } else {
          node.h = node.style.h;
        }
        node.hasChildren = node.children.length > 0;
        node.marker = node.hasChildren && !node.open ? node.children.length : 0;
        node.markerW = node.hasChildren
          ? 24 +
            (node.marker
              ? textWidth(String(node.marker), "400 13px " + sans) + 8
              : 0)
          : 0;
        node.iconW = NODE_ICON_W;
        node.noteW = nodeHasNote(node) ? NOTE_ICON_W : 0;
        node.w = node.iconW + node.labelW + node.noteW + node.markerW;
        if (!node.open || !node.hasChildren) {
          node.subtreeH = node.h;
          return;
        }
        node.children.forEach(layout);
        const inner =
          node.children.reduce((sum, child) => sum + child.subtreeH, 0) +
          GAP_Y * (node.children.length - 1);
        node.subtreeH = Math.max(node.h, inner);
      }

      function place(node, x, top) {
        node.x = x;
        if (!node.open || !node.hasChildren) {
          node.y = top + (node.subtreeH - node.h) / 2;
          return;
        }
        const inner =
          node.children.reduce((sum, child) => sum + child.subtreeH, 0) +
          GAP_Y * (node.children.length - 1);
        let y = top + (node.subtreeH - inner) / 2;
        node.children.forEach((child) => {
          place(child, x + node.w + GAP_X, y);
          y += child.subtreeH + GAP_Y;
        });
        const first = node.children[0];
        const last = node.children[node.children.length - 1];
        const mid = (first.y + first.h / 2 + last.y + last.h / 2) / 2;
        node.y = mid - node.h / 2;
      }

      let tx = 48;
      let ty = 36;
      let scale = 1;

      function screenPoint(x, y) {
        return { x: tx + x * scale, y: ty + y * scale };
      }

      function hideCtxMenu() {
        ctxMenu.classList.remove("show");
      }

      function positionNotePop(anchor) {
        const pad = 8;
        const width = notePop.offsetWidth || 280;
        const height = notePop.offsetHeight || 160;
        let left = anchor.left;
        let top = anchor.bottom + 8;
        if (left + width > window.innerWidth - pad)
          left = window.innerWidth - width - pad;
        if (top + height > window.innerHeight - pad)
          top = Math.max(pad, anchor.top - height - 8);
        if (left < pad) left = pad;
        if (top < pad) top = pad;
        notePop.style.left = `${left}px`;
        notePop.style.top = `${top}px`;
      }

      function noteAnchorRect() {
        if (!noteNode || !noteNode.style) {
          return { left: window.innerWidth / 2 - 140, top: 80, bottom: 100 };
        }
        const x = noteNode.x + (noteNode.iconW || 0) + noteNode.labelW + 4;
        const y = noteNode.y + noteNode.h / 2;
        const pt = screenPoint(x, y);
        return { left: pt.x, top: pt.y - 10, bottom: pt.y + 10 };
      }

      function syncNotePopContent() {
        const text = noteText(noteNode);
        noteView.textContent = text;
        noteEdit.value = text;
        notePop.classList.toggle("editing", noteEditing);
        noteFoot.hidden = !noteEditing;
      }

      function openNote(node, options = {}) {
        if (!node) return;
        const wantEdit = options.edit == null ? canEdit() : !!options.edit;
        const edit = !!(wantEdit && canEdit());
        const clientX = options.clientX;
        const clientY = options.clientY;
        if (editing) commitEdit(true);
        hideCtxMenu();
        hideIconPop();
        if (noteNode && noteNode !== node && noteEditing) commitNote(true);
        selected = node;
        noteNode = node;
        noteEditing = !!edit;
        noteBaseline = noteEditing ? currentSnapshot() : null;
        syncNotePopContent();
        notePop.classList.add("show");
        const anchor =
          clientX != null
            ? { left: clientX, top: clientY, bottom: clientY }
            : noteAnchorRect();
        positionNotePop(anchor);
        updateChrome();
        draw();
        if (noteEditing) {
          requestAnimationFrame(() => {
            noteEdit.focus();
            noteEdit.setSelectionRange(
              noteEdit.value.length,
              noteEdit.value.length,
            );
          });
        }
      }

      function commitNote(save) {
        if (!noteNode) {
          hideNotePop();
          return;
        }
        const node = noteNode;
        const normalized = noteEdit.value
          .replace(/\r\n/g, "\n")
          .replace(/[ \t]+$/gm, "")
          .replace(/^\n+|\n+$/g, "");
        const prev = noteText(node);
        const changed = save && normalized !== prev;
        if (save && changed) {
          if (noteBaseline) history.push(noteBaseline);
          if (normalized) node.note = normalized;
          else delete node.note;
        }
        noteEditing = false;
        noteBaseline = null;
        noteNode = null;
        notePop.classList.remove("show", "editing");
        noteFoot.hidden = true;
        relayout(node);
        saveLocal();
        updateHistoryChrome();
      }

      function hideNotePop({ save = true } = {}) {
        if (!notePop.classList.contains("show")) return;
        if (noteEditing && save) {
          commitNote(true);
          return;
        }
        noteEditing = false;
        noteBaseline = null;
        noteNode = null;
        notePop.classList.remove("show", "editing");
        noteFoot.hidden = true;
      }

      function isSecondaryPointer(event) {
        return event.button === 2 || (event.button === 0 && event.ctrlKey);
      }

      function hideIconPop() {
        iconPop.classList.remove("show");
        iconNode = null;
      }

      function positionIconPop(anchor) {
        const pad = 8;
        const width = iconPop.offsetWidth || 360;
        const height = iconPop.offsetHeight || 320;
        let left = anchor.left;
        let top = anchor.bottom + 8;
        if (left + width > window.innerWidth - pad)
          left = window.innerWidth - width - pad;
        if (top + height > window.innerHeight - pad)
          top = Math.max(pad, anchor.top - height - 8);
        if (left < pad) left = pad;
        if (top < pad) top = pad;
        iconPop.style.left = `${left}px`;
        iconPop.style.top = `${top}px`;
      }

      function emojisForTab(tabId) {
        if (tabId === "recent") return recentIcons.load();
        const cat = EMOJI_CATEGORIES.find((item) => item.id === tabId);
        return cat ? cat.emojis : [];
      }

      function renderIconTabs() {
        iconTabs.replaceChildren();
        ICON_TABS.forEach((tab) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("role", "tab");
          btn.textContent = tab.label;
          btn.className = tab.id === iconTabId ? "active" : "";
          btn.setAttribute(
            "aria-selected",
            tab.id === iconTabId ? "true" : "false",
          );
          btn.addEventListener("click", () => {
            iconTabId = tab.id;
            iconQuery = "";
            iconSearch.value = "";
            renderIconTabs();
            renderIconGrid();
            btn.scrollIntoView({ inline: "nearest", block: "nearest" });
          });
          iconTabs.appendChild(btn);
        });
      }

      function renderIconGrid() {
        const query = iconQuery.trim();
        const emojis = query ? searchEmojis(query) : emojisForTab(iconTabId);
        iconGrid.replaceChildren();
        if (!emojis.length) {
          const empty = document.createElement("p");
          empty.className = "icon-empty";
          empty.textContent = query
            ? "没有匹配的图标"
            : iconTabId === "recent"
              ? "还没有最近使用，选一个会出现在这里"
              : "暂无图标";
          iconGrid.appendChild(empty);
          return;
        }
        emojis.forEach((emoji) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = emoji;
          btn.addEventListener("click", () => applyNodeIcon(emoji));
          iconGrid.appendChild(btn);
        });
      }

      function renderIconPicker() {
        renderIconTabs();
        renderIconGrid();
      }

      function openIconPicker(node, event) {
        if (!node || !canEdit()) return;
        if (editing) commitEdit(true);
        hideCtxMenu();
        hideNotePop({ save: true });
        selected = node;
        iconNode = node;
        iconTabId = "recent";
        iconQuery = "";
        iconSearch.value = "";
        renderIconPicker();
        iconPop.classList.add("show");
        const anchor = event
          ? { left: event.clientX, top: event.clientY, bottom: event.clientY }
          : (() => {
              const pt = screenPoint(node.x, node.y + node.h / 2);
              return { left: pt.x, top: pt.y - 12, bottom: pt.y + 12 };
            })();
        positionIconPop(anchor);
        requestAnimationFrame(() => {
          iconSearch.focus();
        });
        updateChrome();
        draw();
      }

      function applyNodeIcon(emoji) {
        if (!iconNode || !canEdit()) return;
        const node = iconNode;
        const next = String(emoji || "").trim();
        const prev = iconText(node);
        if (next === prev) {
          hideIconPop();
          draw();
          return;
        }
        pushHistory();
        if (next) {
          node.icon = next;
          recentIcons.push(next);
        } else {
          delete node.icon;
        }
        hideIconPop();
        relayout(node);
        saveLocal();
      }

      function clearNodeIcon() {
        applyNodeIcon("");
      }

      function showCtxMenu(clientX, clientY, node) {
        if (!node || editing || !canEdit()) return;
        clearLongPress();
        hideNotePop({ save: true });
        hideIconPop();
        if (selected !== node) {
          selected = node;
          draw();
        } else {
          updateChrome();
        }
        updateCtxMenuChrome();
        ctxMenu.classList.add("show");
        const pad = 8;
        const width = ctxMenu.offsetWidth || 180;
        const height = ctxMenu.offsetHeight || 180;
        let left = clientX;
        let top = clientY;
        if (left + width > window.innerWidth - pad)
          left = window.innerWidth - width - pad;
        if (top + height > window.innerHeight - pad)
          top = window.innerHeight - height - pad;
        if (left < pad) left = pad;
        if (top < pad) top = pad;
        ctxMenu.style.left = `${left}px`;
        ctxMenu.style.top = `${top}px`;
      }

      function nodeFromEventTarget(target) {
        const host =
          target && target.closest && target.closest("[data-node-path]");
        if (!host) return null;
        const raw = host.getAttribute("data-node-path");
        if (raw === "") return tree;
        return nodeAtPath(tree, raw.split(",").map(Number));
      }

      function clearLongPress() {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        longPressArmed = false;
      }

      function armLongPress(event, node) {
        if (editing || !canEdit()) return;
        if (event.pointerType !== "touch") return;
        clearLongPress();
        longPressArmed = true;
        const x = event.clientX;
        const y = event.clientY;
        const pointerId = event.pointerId;
        longPressTimer = setTimeout(() => {
          if (!longPressArmed || (drag && drag.moved)) return;
          longPressArmed = false;
          longPressTimer = null;
          suppressNextTap = true;
          drag = null;
          svg.classList.remove("dragging");
          try {
            svg.releasePointerCapture(pointerId);
          } catch (_) {}
          if (!canEdit()) return;
          showCtxMenu(x, y, node);
        }, LONG_PRESS_MS);
      }

      function bindSubtitleGesture(group, node, textX, contentTop) {
        const sub = descText(node);
        if (!sub) return;
        const subW = textWidth(sub, "400 " + DESC_SIZE + "px " + sans);
        const hitY = contentTop + node.style.size;
        const subHit = document.createElementNS(NS, "rect");
        subHit.setAttribute("x", textX - 4);
        subHit.setAttribute("y", hitY);
        subHit.setAttribute("width", Math.max(subW, 12) + 8);
        subHit.setAttribute(
          "height",
          Math.max(DESC_SIZE + 6, node.y + node.h - hitY),
        );
        subHit.setAttribute("fill", "transparent");
        subHit.setAttribute("data-field", "desc");
        subHit.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
          if (isSecondaryPointer(event)) return;
          armDrag(event, node, "desc");
        });
        group.appendChild(subHit);
      }

      function draw() {
        const activeValue = editing && editInput ? editInput.value : null;
        const selectionStart =
          editing && editInput ? editInput.selectionStart : null;
        const selectionEnd =
          editing && editInput ? editInput.selectionEnd : null;

        viewport.replaceChildren();
        const links = document.createElementNS(NS, "g");
        const nodes = document.createElementNS(NS, "g");
        viewport.append(links, nodes);

        function visit(node) {
          if (!node.style) return;
          if (node.open) {
            node.children.forEach((child) => {
              if (!child.style) return;
              const x1 = node.x + node.w;
              const y1 = node.y + node.h / 2;
              const x2 = child.x;
              const y2 = child.y + child.h / 2;
              const bend = Math.max(20, (x2 - x1) * 0.46);
              const path = document.createElementNS(NS, "path");
              path.setAttribute(
                "d",
                "M " +
                  x1 +
                  " " +
                  y1 +
                  " C " +
                  (x1 + bend) +
                  " " +
                  y1 +
                  ", " +
                  (x2 - bend) +
                  " " +
                  y2 +
                  ", " +
                  x2 +
                  " " +
                  y2,
              );
              path.setAttribute("fill", "none");
              path.setAttribute("stroke", "#111");
              path.setAttribute("stroke-width", node.depth === 0 ? 1.6 : 1);
              links.appendChild(path);
              visit(child);
            });
          }

          const group = document.createElementNS(NS, "g");
          group.style.cursor = "pointer";
          const nodePath = pathToNode(tree, node);
          group.setAttribute(
            "data-node-path",
            nodePath ? nodePath.join(",") : "",
          );
          const isEditingNode = editing && node === selected;
          const showSub = nodeShowsSubtitle(node);
          const layoutHasSub = node.h > node.style.h;
          const contentH = layoutHasSub
            ? node.style.size + DESC_GAP + DESC_SIZE
            : node.style.size;
          const contentTop = node.y + (node.h - contentH) / 2;
          const titleY = contentTop + node.style.size / 2;
          const subY =
            contentTop + node.style.size + DESC_GAP + DESC_SIZE / 2;
          const textX = node.x + (node.iconW || 0);
          const bodyW = (node.iconW || 0) + node.labelW;
          const noteVisualW = node.noteW ? 16 : 0;
          const editPadX = 4;
          const editMinW = 28;

          if (node === selected || isEditingNode || iconNode === node) {
            const sel = document.createElementNS(NS, "rect");
            sel.setAttribute("x", node.x - 10);
            sel.setAttribute("y", node.y + 2);
            sel.setAttribute("width", Math.max(bodyW + noteVisualW, 48) + 20);
            sel.setAttribute("height", node.h - 4);
            sel.setAttribute("rx", 4);
            sel.setAttribute("fill", "#f0f0f0");
            group.appendChild(sel);
          }

          {
            const iconHit = document.createElementNS(NS, "rect");
            iconHit.setAttribute("x", node.x - 2);
            iconHit.setAttribute("y", node.y + 2);
            iconHit.setAttribute("width", node.iconW || NODE_ICON_W);
            iconHit.setAttribute("height", node.h - 4);
            iconHit.setAttribute("fill", "transparent");
            iconHit.style.cursor = "pointer";
            iconHit.addEventListener("pointerdown", (event) => {
              event.stopPropagation();
              if (isSecondaryPointer(event)) return;
              if (!canEdit()) {
                armDrag(event, node, "select");
                return;
              }
              event.preventDefault();
              openIconPicker(node, event);
            });
            group.appendChild(iconHit);

            const iconLabel = document.createElementNS(NS, "text");
            iconLabel.setAttribute(
              "x",
              node.x + (node.iconW || NODE_ICON_W) / 2 - 1,
            );
            iconLabel.setAttribute("y", titleY);
            iconLabel.setAttribute("text-anchor", "middle");
            iconLabel.setAttribute("dominant-baseline", "central");
            const iconSize = Math.max(14, Math.min(18, node.style.size - 2));
            iconLabel.setAttribute("font-size", iconSize);
            iconLabel.style.pointerEvents = "none";
            if (iconText(node)) {
              iconLabel.textContent = iconText(node);
              // Color emoji paints high in the em box, above the name's ink.
              iconLabel.setAttribute("dy", (iconSize * 0.08).toFixed(2));
            } else {
              iconLabel.textContent = "○";
              iconLabel.setAttribute("fill", "#bbb");
              iconLabel.setAttribute("font-family", sans);
              iconLabel.setAttribute("font-size", 12);
            }
            group.appendChild(iconLabel);
          }

          if (!isEditingNode) {
            const hit = document.createElementNS(NS, "rect");
            hit.setAttribute("x", textX - 4);
            hit.setAttribute("y", node.y);
            hit.setAttribute("width", Math.max(node.labelW, 12) + 8);
            hit.setAttribute("height", node.h);
            hit.setAttribute("fill", "transparent");
            group.appendChild(hit);

            const label = document.createElementNS(NS, "text");
            label.setAttribute("x", textX);
            label.setAttribute("y", titleY);
            label.setAttribute("dominant-baseline", "central");
            label.setAttribute("fill", node.style.fill);
            label.setAttribute("font-family", node.style.family);
            label.setAttribute("font-size", node.style.size);
            label.setAttribute("font-weight", node.style.weight);
            label.textContent = node.title;
            group.appendChild(label);

            if (showSub) {
              const sub = document.createElementNS(NS, "text");
              sub.setAttribute("x", textX);
              sub.setAttribute("y", subY);
              sub.setAttribute("dominant-baseline", "central");
              sub.setAttribute("fill", "#888");
              sub.setAttribute("font-family", sans);
              sub.setAttribute("font-size", DESC_SIZE);
              sub.setAttribute("font-weight", 400);
              sub.style.pointerEvents = "none";
              sub.textContent = descText(node);
              group.appendChild(sub);
              bindSubtitleGesture(group, node, textX, contentTop);
            }
          } else {
            const editingTitle = editField === "title";
            const editingSub = editField === "desc";
            const placeholderW =
              editingSub && !descText(node)
                ? textWidth("副标题", "400 " + DESC_SIZE + "px " + sans)
                : 0;
            const editW = Math.max(
              node.labelW + editPadX * 2,
              placeholderW + editPadX * 2,
              editMinW,
            );

            if (editingTitle) {
              const fo = document.createElementNS(NS, "foreignObject");
              fo.setAttribute("x", textX - editPadX);
              fo.setAttribute("y", contentTop);
              fo.setAttribute("width", editW);
              fo.setAttribute("height", node.style.size + 2);
              const input = document.createElement("input");
              input.className = "inline-edit";
              input.type = "text";
              input.autocomplete = "off";
              input.spellcheck = false;
              input.value = activeValue != null ? activeValue : node.title;
              input.style.fontFamily = node.style.family;
              input.style.fontSize = node.style.size + "px";
              input.style.fontWeight = node.style.weight;
              fo.appendChild(input);
              group.appendChild(fo);
              editInput = input;
            } else {
              const label = document.createElementNS(NS, "text");
              label.setAttribute("x", textX);
              label.setAttribute("y", titleY);
              label.setAttribute("dominant-baseline", "central");
              label.setAttribute("fill", node.style.fill);
              label.setAttribute("font-family", node.style.family);
              label.setAttribute("font-size", node.style.size);
              label.setAttribute("font-weight", node.style.weight);
              label.textContent = node.title;
              group.appendChild(label);
            }

            if (editingSub) {
              const fo = document.createElementNS(NS, "foreignObject");
              fo.setAttribute("x", textX - editPadX);
              fo.setAttribute(
                "y",
                contentTop + node.style.size + DESC_GAP,
              );
              fo.setAttribute("width", editW);
              fo.setAttribute("height", DESC_SIZE + 2);
              const input = document.createElement("input");
              input.className = "inline-edit";
              input.type = "text";
              input.autocomplete = "off";
              input.spellcheck = false;
              input.placeholder = "副标题";
              input.value =
                activeValue != null ? activeValue : descText(node);
              input.style.fontFamily = sans;
              input.style.fontSize = DESC_SIZE + "px";
              input.style.fontWeight = 400;
              fo.appendChild(input);
              group.appendChild(fo);
              editInput = input;
            } else if (showSub) {
              const sub = document.createElementNS(NS, "text");
              sub.setAttribute("x", textX);
              sub.setAttribute("y", subY);
              sub.setAttribute("dominant-baseline", "central");
              sub.setAttribute("fill", "#888");
              sub.setAttribute("font-family", sans);
              sub.setAttribute("font-size", DESC_SIZE);
              sub.setAttribute("font-weight", 400);
              sub.textContent = descText(node);
              group.appendChild(sub);
            }

            if (editInput) {
              const input = editInput;
              const fo = input.parentNode;
              input.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                  event.preventDefault();
                  commitEdit(true);
                } else if (event.key === "Escape") {
                  event.preventDefault();
                  commitEdit(false);
                } else if (event.key === "Tab" && editField === "title") {
                  event.preventDefault();
                  commitEdit(true);
                  addChild(selected);
                }
              });
              input.addEventListener("input", () => {
                const value = input.value || " ";
                if (editField === "title") {
                  node.labelW = textWidth(
                    value,
                    node.style.weight +
                      " " +
                      node.style.size +
                      "px " +
                      node.style.family,
                  );
                  const subW = descText(node)
                    ? textWidth(
                        descText(node),
                        "400 " + DESC_SIZE + "px " + sans,
                      )
                    : 0;
                  node.labelW = Math.max(node.labelW, subW);
                } else {
                  const titleW = textWidth(
                    node.title || " ",
                    node.style.weight +
                      " " +
                      node.style.size +
                      "px " +
                      node.style.family,
                  );
                  const subW = textWidth(
                    value || " ",
                    "400 " + DESC_SIZE + "px " + sans,
                  );
                  node.labelW = Math.max(titleW, subW);
                }
                fo.setAttribute(
                  "width",
                  Math.max(node.labelW + editPadX * 2, editMinW),
                );
              });
              input.addEventListener("blur", () => {
                if (ignoreBlur) return;
                commitEdit(true);
              });

              requestAnimationFrame(() => {
                if (!editInput) return;
                editInput.focus();
                if (selectionStart != null && selectionEnd != null) {
                  try {
                    editInput.setSelectionRange(selectionStart, selectionEnd);
                  } catch (_) {
                    editInput.select();
                  }
                } else {
                  editInput.select();
                }
              });
            }
          }

          if (node.noteW) {
            const nx = node.x + (node.iconW || 0) + node.labelW + 11;
            const ny = node.y + node.h / 2;
            const noteIcon = document.createElementNS(NS, "g");
            noteIcon.style.cursor = "pointer";
            const noteHit = document.createElementNS(NS, "circle");
            noteHit.setAttribute("cx", nx);
            noteHit.setAttribute("cy", ny);
            noteHit.setAttribute("r", 10);
            noteHit.setAttribute("fill", "transparent");
            noteIcon.appendChild(noteHit);
            const paper = document.createElementNS(NS, "path");
            paper.setAttribute(
              "d",
              `M ${nx - 5} ${ny - 6} h 7 l 3 3 v 9 h -10 z M ${nx + 2} ${ny - 6} v 3 h 3`,
            );
            paper.setAttribute(
              "fill",
              noteNode === node && notePop.classList.contains("show")
                ? "#eee"
                : "#fff",
            );
            paper.setAttribute("stroke", "#666");
            paper.setAttribute("stroke-width", 1.2);
            paper.setAttribute("stroke-linejoin", "round");
            noteIcon.appendChild(paper);
            noteIcon.addEventListener("pointerdown", (event) => {
              event.stopPropagation();
              if (isSecondaryPointer(event)) return;
              event.preventDefault();
              openNote(node, {
                clientX: event.clientX,
                clientY: event.clientY,
              });
            });
            group.appendChild(noteIcon);
          }

          if (node.hasChildren) {
            const baseRight =
              (node.iconW || 0) + node.labelW + (node.noteW || 0);
            const mx = node.x + baseRight + 16;
            const my = node.y + node.h / 2;
            const mark = document.createElementNS(NS, "circle");
            mark.setAttribute("cx", mx);
            mark.setAttribute("cy", my);
            mark.setAttribute("r", 7);
            mark.setAttribute("fill", "#fff");
            mark.setAttribute("stroke", "#111");
            mark.setAttribute("stroke-width", 1.2);
            group.appendChild(mark);
            const hline = document.createElementNS(NS, "path");
            hline.setAttribute(
              "d",
              "M " + (mx - 3.2) + " " + my + " H " + (mx + 3.2),
            );
            hline.setAttribute("stroke", "#111");
            hline.setAttribute("stroke-width", 1.2);
            hline.setAttribute("fill", "none");
            group.appendChild(hline);
            if (!node.open) {
              const vline = document.createElementNS(NS, "path");
              vline.setAttribute(
                "d",
                "M " + mx + " " + (my - 3.2) + " V " + (my + 3.2),
              );
              vline.setAttribute("stroke", "#111");
              vline.setAttribute("stroke-width", 1.2);
              vline.setAttribute("fill", "none");
              group.appendChild(vline);
            }
            if (node.marker) {
              const count = document.createElementNS(NS, "text");
              count.setAttribute("x", mx + 14);
              count.setAttribute("y", my);
              count.setAttribute("dominant-baseline", "central");
              count.setAttribute("fill", "#888");
              count.setAttribute("font-family", sans);
              count.setAttribute("font-size", 13);
              count.setAttribute("font-weight", 400);
              count.textContent = String(node.marker);
              group.appendChild(count);
            }
            if (!isEditingNode) {
              const markHit = document.createElementNS(NS, "circle");
              markHit.setAttribute("cx", mx);
              markHit.setAttribute("cy", my);
              markHit.setAttribute("r", 12);
              markHit.setAttribute("fill", "transparent");
              markHit.style.cursor = "pointer";
              markHit.addEventListener("pointerdown", (event) => {
                event.stopPropagation();
                if (isSecondaryPointer(event)) return;
                armDrag(event, node, "toggle");
              });
              group.appendChild(markHit);
            }
          }

          if (!isEditingNode) {
            group.addEventListener("pointerdown", (event) => {
              event.stopPropagation();
              if (isSecondaryPointer(event)) return;
              armDrag(event, node, "select");
              armLongPress(event, node);
            });
          }
          nodes.appendChild(group);
        }

        visit(tree);
        apply();
        updateChrome();
      }

      function apply() {
        viewport.setAttribute(
          "transform",
          "translate(" + tx + " " + ty + ") scale(" + scale + ")",
        );
      }

      function relayout(anchor) {
        const before = anchor ? anchor.y : 0;
        layout(tree);
        place(tree, 0, 0);
        if (anchor && anchor.y != null) ty += (before - anchor.y) * scale;
        draw();
      }

      let drag = null;
      const activePointers = new Map();
      let pinch = null;

      function zoomAt(px, py, next) {
        const clamped = Math.min(2.4, Math.max(0.35, next));
        if (clamped === scale) return;
        tx = px - ((px - tx) * clamped) / scale;
        ty = py - ((py - ty) * clamped) / scale;
        scale = clamped;
      }

      function pointerPair() {
        if (activePointers.size < 2) return null;
        const pts = Array.from(activePointers.values());
        return [pts[0], pts[1]];
      }

      function beginPinch() {
        const pair = pointerPair();
        if (!pair) return;
        clearLongPress();
        hideCtxMenu();
        drag = null;
        svg.classList.add("dragging");
        const [a, b] = pair;
        const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        pinch = {
          dist,
          scale,
          tx,
          ty,
          midX: (a.x + b.x) / 2,
          midY: (a.y + b.y) / 2,
        };
      }

      function updatePinch() {
        const pair = pointerPair();
        if (!pair || !pinch) return;
        const [a, b] = pair;
        const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2;
        const rect = svg.getBoundingClientRect();
        const px = pinch.midX - rect.left;
        const py = pinch.midY - rect.top;
        scale = pinch.scale;
        tx = pinch.tx;
        ty = pinch.ty;
        zoomAt(px, py, pinch.scale * (dist / pinch.dist));
        tx += midX - pinch.midX;
        ty += midY - pinch.midY;
        apply();
      }

      function armDrag(event, node, mode) {
        if (editing) return;
        if (isSecondaryPointer(event)) return;
        hideCtxMenu();
        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
        });
        try {
          svg.setPointerCapture(event.pointerId);
        } catch (_) {}
        if (activePointers.size >= 2) {
          beginPinch();
          return;
        }
        pinch = null;
        drag = {
          x: event.clientX,
          y: event.clientY,
          tx,
          ty,
          moved: false,
          node,
          mode,
          pointerId: event.pointerId,
        };
      }
      svg.addEventListener("pointerdown", (event) => {
        if (editing) return;
        if (isSecondaryPointer(event)) return;
        if (!event.target.closest || !event.target.closest("[data-node-path]"))
          hideCtxMenu();
        armDrag(event, null, "pan");
      });
      svg.addEventListener("pointermove", (event) => {
        if (editing) return;
        if (activePointers.has(event.pointerId)) {
          activePointers.set(event.pointerId, {
            x: event.clientX,
            y: event.clientY,
          });
        }
        if (activePointers.size >= 2) {
          if (!pinch) beginPinch();
          updatePinch();
          return;
        }
        if (!drag) return;
        const dx = event.clientX - drag.x;
        const dy = event.clientY - drag.y;
        if (!drag.moved && Math.hypot(dx, dy) < 5) return;
        drag.moved = true;
        clearLongPress();
        hideCtxMenu();
        svg.classList.add("dragging");
        tx = drag.tx + dx;
        ty = drag.ty + dy;
        apply();
      });
      function endDrag(event) {
        if (event && event.pointerId != null) {
          activePointers.delete(event.pointerId);
          try {
            svg.releasePointerCapture(event.pointerId);
          } catch (_) {}
        }
        if (pinch) {
          clearLongPress();
          if (activePointers.size >= 2) {
            beginPinch();
            return;
          }
          pinch = null;
          drag = null;
          svg.classList.remove("dragging");
          if (activePointers.size === 1) {
            const [id, pt] = activePointers.entries().next().value;
            drag = {
              x: pt.x,
              y: pt.y,
              tx,
              ty,
              moved: true,
              node: null,
              mode: "pan",
              pointerId: id,
            };
          }
          return;
        }
        clearLongPress();
        if (suppressNextTap) {
          suppressNextTap = false;
          drag = null;
          svg.classList.remove("dragging");
          return;
        }
        if (drag && !drag.moved && drag.node) {
          if (drag.mode === "toggle") {
            hideCtxMenu();
            drag.node.open = !drag.node.open;
            selected = drag.node;
            relayout(drag.node);
            saveLocal();
          } else if (drag.mode === "select" || drag.mode === "desc") {
            const field = drag.mode === "desc" ? "desc" : "title";
            hideCtxMenu();
            if (!canEdit()) {
              selected = drag.node;
              draw();
            } else {
              const result = recognizeNodeTap(
                null,
                drag.node,
                Date.now(),
                undefined,
                field,
              );
              if (result.action === "edit") beginEdit(drag.node, field);
              else {
                selected = drag.node;
                draw();
              }
            }
          }
        } else if (drag && !drag.moved && !drag.node) {
          selected = null;
          hideCtxMenu();
          draw();
        }
        drag = null;
        svg.classList.remove("dragging");
      }
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", (event) => {
        clearLongPress();
        if (event && event.pointerId != null) {
          activePointers.delete(event.pointerId);
        } else {
          activePointers.clear();
        }
        pinch = null;
        drag = null;
        svg.classList.remove("dragging");
      });
      svg.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        const node = nodeFromEventTarget(event.target);
        if (!node || !canEdit()) {
          hideCtxMenu();
          if (node) {
            selected = node;
            draw();
          }
          return;
        }
        showCtxMenu(event.clientX, event.clientY, node);
      });
      svg.addEventListener(
        "wheel",
        (event) => {
          if (editing) return;
          event.preventDefault();
          if (event.ctrlKey || event.metaKey) {
            const rect = svg.getBoundingClientRect();
            zoomAt(
              event.clientX - rect.left,
              event.clientY - rect.top,
              scale * (event.deltaY < 0 ? 1.08 : 0.92),
            );
          } else {
            tx -= event.deltaX;
            ty -= event.deltaY;
          }
          apply();
        },
        { passive: false },
      );

      function bounds() {
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        (function scan(node) {
          if (!node.style) return;
          minX = Math.min(minX, node.x);
          minY = Math.min(minY, node.y);
          maxX = Math.max(maxX, node.x + node.w);
          maxY = Math.max(maxY, node.y + node.h);
          if (node.open) node.children.forEach(scan);
        })(tree);
        return { minX, minY, w: maxX - minX, h: maxY - minY };
      }

      function frame() {
        layout(tree);
        place(tree, 0, 0);
        const box = bounds();
        const pad = 40;
        const fitW = (window.innerWidth - pad * 2) / Math.max(box.w, 1);
        const fitH = (window.innerHeight - pad * 2) / Math.max(box.h, 1);
        const fit = Math.min(fitW, fitH);
        scale = Math.min(
          1,
          Number.isFinite(fit) ? (fit >= 0.78 ? fit : fitW) : 1,
        );
        if (!Number.isFinite(scale) || scale <= 0) scale = 1;
        tx = (window.innerWidth - box.w * scale) / 2 - box.minX * scale;
        const fittedH = box.h * scale;
        ty =
          fittedH < window.innerHeight - pad
            ? (window.innerHeight - fittedH) / 2 - box.minY * scale
            : window.innerHeight / 2 - (tree.y + tree.h / 2) * scale;
        draw();
      }

      function beginEdit(node, field = "title") {
        if (!node || !canEdit()) return;
        hideCtxMenu();
        hideNotePop({ save: true });
        hideIconPop();
        const nextField = field === "desc" ? "desc" : "title";
        if (editing && selected === node && editField === nextField) {
          editInput && editInput.focus();
          return;
        }
        if (editing) commitEdit(true);
        selected = node;
        editing = true;
        editField = nextField;
        editInput = null;
        editBaseline = currentSnapshot();
        layout(tree);
        place(tree, 0, 0);
        draw();
      }

      function commitEdit(save) {
        if (!editing) return;
        const node = selected;
        const field = editField;
        const raw = editInput
          ? editInput.value.replace(/\s+/g, " ").trim()
          : "";
        const baselineNode = editBaseline
          ? editBaseline.selectedPath && editBaseline.selectedPath.length
            ? nodeAtPath(editBaseline.tree, editBaseline.selectedPath)
            : editBaseline.tree
          : null;
        let changed = false;
        if (save && node && baselineNode) {
          if (field === "desc") {
            const prev = baselineNode.desc
              ? String(baselineNode.desc).trim()
              : "";
            changed = raw !== prev;
          } else {
            const nextTitle = raw || "未命名";
            changed = nextTitle !== baselineNode.title;
          }
        }
        ignoreBlur = true;
        editing = false;
        editInput = null;
        editField = "title";
        if (save && node) {
          if (changed && editBaseline) history.push(editBaseline);
          if (field === "desc") {
            if (raw) node.desc = raw;
            else delete node.desc;
          } else {
            node.title = raw || "未命名";
          }
          if (node === tree) {
            document.title = pageTitleOf(tree) + " · mm";
            svg.setAttribute("aria-label", pageTitleOf(tree));
          }
        }
        editBaseline = null;
        relayout(node);
        saveLocal();
        updateHistoryChrome();
        requestAnimationFrame(() => {
          ignoreBlur = false;
        });
      }

      function addChild(parent) {
        if (!parent || !canEdit()) return;
        if (editing) commitEdit(true);
        pushHistory();
        const child = {
          title: "新节点",
          children: [],
          open: true,
          depth: (parent.depth || 0) + 1,
        };
        parent.children.push(child);
        parent.open = true;
        refreshDepth(tree, 0);
        selected = child;
        editing = true;
        editField = "title";
        editInput = null;
        editBaseline = currentSnapshot();
        layout(tree);
        place(tree, 0, 0);
        draw();
        saveLocal();
      }

      function addSibling(node) {
        const info = locate(node);
        if (!info || !info.parent || !canEdit()) return;
        if (editing) commitEdit(true);
        pushHistory();
        const sibling = { title: "新节点", children: [], open: true };
        info.parent.children.splice(info.index + 1, 0, sibling);
        refreshDepth(tree, 0);
        selected = sibling;
        editing = true;
        editField = "title";
        editInput = null;
        editBaseline = currentSnapshot();
        layout(tree);
        place(tree, 0, 0);
        draw();
        saveLocal();
      }

      function deleteNode(node) {
        if (!canEdit()) return;
        const info = locate(node);
        if (!info || !info.parent) {
          toast("不能删除中心节点");
          return;
        }
        if (editing) commitEdit(true);
        hideCtxMenu();
        pushHistory();
        const parent = info.parent;
        parent.children.splice(info.index, 1);
        refreshDepth(tree, 0);
        selected = parent;
        relayout(parent);
        saveLocal();
      }

      ctxMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        ignoreBlur = true;
      });
      ctxMenu.addEventListener("click", (event) => {
        const btn = event.target.closest("button[data-act]");
        if (!btn || btn.disabled) return;
        event.stopPropagation();
        const act = btn.getAttribute("data-act");
        hideCtxMenu();
        if (act === "rename") beginEdit(selected, "title");
        if (act === "desc") beginEdit(selected, "desc");
        if (act === "note") openNote(selected, { edit: true });
        if (act === "child") addChild(selected);
        if (act === "sibling") addSibling(selected);
        if (act === "delete") deleteNode(selected);
        requestAnimationFrame(() => {
          ignoreBlur = false;
        });
      });

      notePop.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });
      document
        .getElementById("noteSave")
        .addEventListener("click", () => commitNote(true));
      document.getElementById("noteCancel").addEventListener("click", () => {
        hideNotePop({ save: false });
        draw();
      });
      noteEdit.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          document.getElementById("noteCancel").click();
        } else if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          commitNote(true);
        }
      });

      undoBtn.addEventListener("click", undo);
      redoBtn.addEventListener("click", redo);

      window.addEventListener("keydown", (event) => {
        if (iconPop.classList.contains("show") && event.key === "Escape") {
          event.preventDefault();
          hideIconPop();
          draw();
          return;
        }
        if (notePop.classList.contains("show") && event.key === "Escape") {
          event.preventDefault();
          if (noteEditing) document.getElementById("noteCancel").click();
          else hideNotePop({ save: false });
          return;
        }
        if (
          confirmModal.classList.contains("show") ||
          downloadModal.classList.contains("show")
        ) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeConfirm(false);
            closeDownload();
          }
          return;
        }
        const mod = event.metaKey || event.ctrlKey;
        if (mod && event.key.toLowerCase() === "z") {
          if (!canEdit()) return;
          event.preventDefault();
          if (event.shiftKey) redo();
          else undo();
          return;
        }
        if (mod && event.key.toLowerCase() === "y") {
          if (!canEdit()) return;
          event.preventDefault();
          redo();
          return;
        }
        const tag = event.target && event.target.tagName;
        const inField =
          tag === "INPUT" ||
          tag === "TEXTAREA" ||
          event.target.isContentEditable;
        if (
          mod &&
          !editing &&
          !inField &&
          (event.key === "=" ||
            event.key === "+" ||
            event.key === "-" ||
            event.key === "0" ||
            event.code === "NumpadAdd" ||
            event.code === "NumpadSubtract" ||
            event.code === "Numpad0")
        ) {
          event.preventDefault();
          if (event.key === "0" || event.code === "Numpad0") {
            frame();
            return;
          }
          const zoomIn =
            event.key === "=" ||
            event.key === "+" ||
            event.code === "NumpadAdd";
          const rect = svg.getBoundingClientRect();
          zoomAt(
            window.innerWidth / 2 - rect.left,
            window.innerHeight / 2 - rect.top,
            scale * (zoomIn ? 1.2 : 1 / 1.2),
          );
          apply();
          return;
        }
        if (editing) return;
        if (inField) return;
        if (modeSwitch.contains(event.target)) return;
        if (!selected && event.key !== "Escape") return;
        if (!canEdit()) {
          if (event.key === "Escape") {
            event.preventDefault();
            hideCtxMenu();
            selected = null;
            draw();
          }
          return;
        }
        if (event.key === "Tab") {
          event.preventDefault();
          addChild(selected);
        } else if (event.key === "Enter") {
          event.preventDefault();
          if (selected === tree) addChild(selected);
          else addSibling(selected);
        } else if (event.key === "F2") {
          event.preventDefault();
          beginEdit(selected);
        } else if (event.key === "Backspace" || event.key === "Delete") {
          event.preventDefault();
          deleteNode(selected);
        } else if (event.key === "Escape") {
          hideCtxMenu();
          selected = null;
          draw();
        }
      });

      function loadTree(
        next,
        name,
        keepOpen,
        { recordHistory = false, persist = true } = {},
      ) {
        if (editing) {
          editing = false;
          editInput = null;
          editBaseline = null;
        }
        if (recordHistory) pushHistory();
        tree = next;
        selected = null;
        if (name) fileName = name.replace(/\.markdown$/i, ".md");
        prepare(tree, keepOpen);
        const title = pageTitleOf(tree);
        document.title = title + " · mm";
        svg.setAttribute("aria-label", title);
        frame();
        if (persist) saveLocal();
        updateHistoryChrome();
      }

      function openImportConfirm(file) {
        pendingConfirm = { type: "import", file };
        confirmTitle.textContent = "覆盖当前导图？";
        confirmText.textContent = `导入「${file.name || "Markdown"}」将替换当前导图。可之后撤销。`;
        confirmOk.textContent = "覆盖导入";
        confirmModal.classList.add("show");
      }

      function openCloseConfirm() {
        pendingConfirm = { type: "close" };
        confirmTitle.textContent = "关闭当前文档？";
        confirmText.textContent =
          "将清除本地自动保存并回到欢迎页，此操作不可撤销。";
        confirmOk.textContent = "关闭文档";
        confirmModal.classList.add("show");
      }

      function closeConfirm(confirmed) {
        confirmModal.classList.remove("show");
        const pending = pendingConfirm;
        pendingConfirm = null;
        if (!confirmed || !pending) return;
        if (pending.type === "import" && pending.file) doImport(pending.file);
        else if (pending.type === "close") closeDocument();
      }

      function closeDocument() {
        hideCtxMenu();
        hideNotePop({ save: false });
        hideIconPop();
        loadTree(cloneData(DEMO), "mindmap.md", true, { persist: false });
        history.clear();
        store.clear();
        updateHistoryChrome();
        toast("已关闭文档");
      }

      function requestCloseDocument() {
        if (!canEdit()) {
          toast("只读模式下不能关闭文档");
          return;
        }
        if (editing) commitEdit(true);
        if (noteEditing) commitNote(true);
        openCloseConfirm();
      }

      async function doImport(file) {
        try {
          const text = await file.text();
          loadTree(parseMarkdown(text), file.name || "outline.md", false, {
            recordHistory: true,
          });
          toast("已导入 " + (file.name || "Markdown"));
        } catch (error) {
          toast(error.message || String(error));
        }
      }

      async function requestImport(file) {
        if (!file) return;
        if (!canEdit()) {
          toast("只读模式下不能导入");
          return;
        }
        if (
          !/\.(md|markdown|txt)$/i.test(file.name || "") &&
          file.type &&
          !/^text\//.test(file.type)
        ) {
          toast("请选择 Markdown 文本文件");
          return;
        }
        if (shouldConfirmOverwrite(tree)) openImportConfirm(file);
        else doImport(file);
      }

      function openDownload() {
        if (editing) commitEdit(true);
        downloadName.value = (fileName || tree.title || "mindmap").replace(
          /\.(md|markdown|txt|html|xmind|opml|json)$/i,
          "",
        );
        downloadFormat.value = "markdown";
        downloadModal.classList.add("show");
        downloadName.focus();
        downloadName.select();
      }

      function closeDownload() {
        downloadModal.classList.remove("show");
      }

      function confirmDownload() {
        try {
          const packed = buildDownload(
            tree,
            downloadFormat.value,
            downloadName.value,
          );
          const blob = new Blob([packed.content], { type: packed.mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = packed.filename;
          a.click();
          URL.revokeObjectURL(url);
          fileName = packed.filename;
          saveLocal();
          closeDownload();
          toast("已导出 " + packed.filename);
        } catch (error) {
          toast(error.message || String(error));
        }
      }

      uploadBtn.addEventListener("click", () => fileInput.click());
      closeDocBtn.addEventListener("click", requestCloseDocument);
      modeSwitch.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-mode]");
        if (!btn) return;
        setAppMode(btn.getAttribute("data-mode"));
      });
      modeSwitch.addEventListener("keydown", (event) => {
        if (
          event.key !== "ArrowLeft" &&
          event.key !== "ArrowRight" &&
          event.key !== "Home" &&
          event.key !== "End"
        )
          return;
        event.preventDefault();
        const next =
          event.key === "ArrowLeft" || event.key === "Home" ? "view" : "edit";
        setAppMode(next);
        const current = modeSwitch.querySelector(`[data-mode="${appMode}"]`);
        if (current) current.focus();
      });
      fontSelect.addEventListener("change", () => {
        setFont(fontSelect.value);
      });
      document
        .getElementById("downloadBtn")
        .addEventListener("click", openDownload);
      const settings = document.getElementById("settings");
      const settingsBtn = document.getElementById("settingsBtn");
      function setSettingsOpen(open) {
        settings.classList.toggle("open", open);
        settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
      }
      settingsBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        setSettingsOpen(!settings.classList.contains("open"));
      });
      window.addEventListener("pointerdown", (event) => {
        if (!settings.classList.contains("open")) return;
        if (settings.contains(event.target)) return;
        setSettingsOpen(false);
      });
      window.addEventListener(
        "keydown",
        (event) => {
          if (event.key === "Escape" && settings.classList.contains("open"))
            setSettingsOpen(false);
        },
        true,
      );
      document
        .getElementById("confirmCancel")
        .addEventListener("click", () => closeConfirm(false));
      document
        .getElementById("confirmOk")
        .addEventListener("click", () => closeConfirm(true));
      document
        .getElementById("downloadCancel")
        .addEventListener("click", closeDownload);
      document
        .getElementById("downloadOk")
        .addEventListener("click", confirmDownload);
      downloadName.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          confirmDownload();
        }
      });
      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        requestImport(file);
      });

      let dragDepth = 0;
      window.addEventListener("dragenter", (event) => {
        event.preventDefault();
        if (!canEdit()) return;
        dragDepth += 1;
        document.body.classList.add("dragging-file");
      });
      window.addEventListener("dragover", (event) => event.preventDefault());
      window.addEventListener("dragleave", (event) => {
        event.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) document.body.classList.remove("dragging-file");
      });
      window.addEventListener("drop", (event) => {
        event.preventDefault();
        dragDepth = 0;
        document.body.classList.remove("dragging-file");
        const file =
          event.dataTransfer &&
          event.dataTransfer.files &&
          event.dataTransfer.files[0];
        requestImport(file);
      });

      confirmModal.addEventListener("click", (event) => {
        if (event.target === confirmModal) closeConfirm(false);
      });
      downloadModal.addEventListener("click", (event) => {
        if (event.target === downloadModal) closeDownload();
      });

      const cached = store.load();
      if (cached) {
        tree = cached.tree;
        fileName = cached.fileName || "mindmap.md";
        prepare(tree, true);
        document.title = pageTitleOf(tree) + " · mm";
        svg.setAttribute("aria-label", pageTitleOf(tree));
      } else {
        tree = cloneData(DEMO);
        prepare(tree, true);
      }
      syncModeSwitch();
      frame();
      iconPop.addEventListener("pointerdown", (event) =>
        event.stopPropagation(),
      );
      iconSearch.addEventListener("input", () => {
        iconQuery = iconSearch.value;
        renderIconGrid();
      });
      iconSearch.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();
          if (iconQuery.trim()) {
            iconQuery = "";
            iconSearch.value = "";
            renderIconGrid();
            return;
          }
          hideIconPop();
          draw();
        }
      });
      document
        .getElementById("iconClear")
        .addEventListener("click", () => clearNodeIcon());
      document.getElementById("iconClose").addEventListener("click", () => {
        hideIconPop();
        draw();
      });

      window.addEventListener("pointerdown", (event) => {
        if (
          ctxMenu.classList.contains("show") &&
          !ctxMenu.contains(event.target)
        )
          hideCtxMenu();
        if (
          notePop.classList.contains("show") &&
          !notePop.contains(event.target)
        ) {
          hideNotePop({ save: true });
          draw();
        }
        if (
          iconPop.classList.contains("show") &&
          !iconPop.contains(event.target)
        ) {
          hideIconPop();
          draw();
        }
      });

      window.addEventListener("resize", () => {
        hideCtxMenu();
        if (notePop.classList.contains("show")) hideNotePop({ save: true });
        if (iconPop.classList.contains("show")) hideIconPop();
        if (!editing) frame();
      });

      window.__mm = {
        recognizeNodeTap,
        shouldConfirmOverwrite,
        normalizeDownloadName,
        buildDownload,
        getTree: () => tree,
        getSelected: () => selected,
        isEditing: () => editing,
        canUndo: () => history.canUndo(),
        canRedo: () => history.canRedo(),
        canEdit,
        getMode: () => appMode,
        setMode: (mode) => setAppMode(mode),
        getFont: () => fontId,
        setFont: (id) => setFont(id),
        undo,
        redo,
        beginEdit: (node, field) => beginEdit(node || selected, field),
        clickEdit: (node, field = "title") => {
          if (!canEdit()) return "select";
          const target = node || selected || tree;
          const targetField = field === "desc" ? "desc" : "title";
          const result = recognizeNodeTap(
            null,
            target,
            Date.now(),
            undefined,
            targetField,
          );
          if (result.action === "edit") beginEdit(target, targetField);
          return result.action;
        },
      };

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
