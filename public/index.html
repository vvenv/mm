      downloadName.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          confirmDownload();
        }
      });
      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        requestImport(file);
      });

      let dragDepth = 0;
      window.addEventListener("dragenter", (event) => {
        event.preventDefault();
        if (!canEdit()) return;
        dragDepth += 1;
        document.body.classList.add("dragging-file");
      });
      window.addEventListener("dragover", (event) => event.preventDefault());
      window.addEventListener("dragleave", (event) => {
        event.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) document.body.classList.remove("dragging-file");
      });
      window.addEventListener("drop", (event) => {
        event.preventDefault();
        dragDepth = 0;
        document.body.classList.remove("dragging-file");
        const file =
          event.dataTransfer &&
          event.dataTransfer.files &&
          event.dataTransfer.files[0];
        requestImport(file);
      });

      confirmModal.addEventListener("click", (event) => {
        if (event.target === confirmModal) closeConfirm(false);
      });
      downloadModal.addEventListener("click", (event) => {
        if (event.target === downloadModal) closeDownload();
      });

      async function openSharedTree(sharedTree, source) {
        shareGuest = true;
        tree = sharedTree;
        fileName = `${(sharedTree.title || "mindmap").replace(/[\\/:*?"<>|]+/g, "-").trim() || "mindmap"}.md`;
        prepare(tree, true);
        document.title = pageTitleOf(tree) + " · mm";
        svg.setAttribute("aria-label", pageTitleOf(tree));
        appMode = "view";
        writeAppMode(appMode);
        const links = inboundShareLinks({ ...source, origin: location.origin });
        if (links) rememberShare(JSON.stringify(cloneData(tree)), links);
        markShareVisit();
        syncShareBanner();
      }

      const shareHashRaw = String(location.hash || "").replace(/^#/, "");
      const sharedFromHash = await parseShareHash(location.hash);
      const shareId = parseShareIdFromSearch(location.search);
      let openedShare = false;
      if (sharedFromHash) {
        await openSharedTree(sharedFromHash, { hash: shareHashRaw });
        openedShare = true;
      } else if (shareId) {
        try {
          const payload = await fetchSharePayload(shareId);
          const sharedFromShort = await decodeSharePayload(payload);
          await openSharedTree(sharedFromShort, { id: shareId, payload });
          openedShare = true;
        } catch (error) {
          toast(error.message || "短链打开失败");
        }
      } else if (shareHashRaw.startsWith("v1=")) {
        toast("分享链接无效或已损坏");
      }

      if (!openedShare) {
        const exitShare = takeShareExit();
        const cached = exitShare ? null : store.load();
        if (cached) {
          tree = cached.tree;
          fileName = cached.fileName || "mindmap.md";
          prepare(tree, true);
          document.title = pageTitleOf(tree) + " · mm";
          svg.setAttribute("aria-label", pageTitleOf(tree));
        } else {
          tree = cloneData(DEMO);
          fileName = "mindmap.md";
          prepare(tree, true);
          if (exitShare) {
            shareExitDemo = true;
            document.title = pageTitleOf(tree) + " · mm";
            svg.setAttribute("aria-label", pageTitleOf(tree));
          }
        }
      }
      syncModeSwitch();
      frame();
      iconPop.addEventListener("pointerdown", (event) =>
        event.stopPropagation(),
      );
      iconSearch.addEventListener("input", () => {
        iconQuery = iconSearch.value;
        renderIconGrid();
      });
      iconSearch.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();
          if (iconQuery.trim()) {
            iconQuery = "";
            iconSearch.value = "";
            renderIconGrid();
            return;
          }
          hideIconPop();
          draw();
        }
      });
      document
        .getElementById("iconClear")
        .addEventListener("click", () => clearNodeIcon());
      document.getElementById("iconClose").addEventListener("click", () => {
        hideIconPop();
        draw();
      });

      window.addEventListener("pointerdown", (event) => {
        if (
          ctxMenu.classList.contains("show") &&
          !ctxMenu.contains(event.target)
        )
          hideCtxMenu();
        if (
          notePop.classList.contains("show") &&
          !notePop.contains(event.target)
        ) {
          hideNotePop({ save: true });
          draw();
        }
        if (
          iconPop.classList.contains("show") &&
          !iconPop.contains(event.target)
        ) {
          hideIconPop();
          draw();
        }
      });

      window.addEventListener("resize", () => {
        hideCtxMenu();
        if (notePop.classList.contains("show")) hideNotePop({ save: true });
        if (iconPop.classList.contains("show")) hideIconPop();
        if (!editing) frame();
      });

      window.__mm = {
        shouldConfirmOverwrite,
        normalizeDownloadName,
        buildDownload,
        getTree: () => tree,
        getSelected: () => selected,
        isEditing: () => editing,
        canUndo: () => history.canUndo(),
        canRedo: () => history.canRedo(),
        canEdit,
        getMode: () => appMode,
        setMode: (mode) => setAppMode(mode),
        getFont: () => fontId,
        setFont: (id) => setFont(id),
        getTheme: () => themeId,
        setTheme: (id) => setTheme(id),
        undo,
        redo,
        beginEdit: (node, field) => beginEdit(node || selected, field),
        clickEdit: (node, field = "title") => {
          if (!canEdit()) return "select";
          const target = node || selected || tree;
          const targetField = field === "desc" ? "desc" : "title";
          beginEdit(target, targetField);
          return "edit";
        },
      };

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
