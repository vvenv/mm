        if (node === ancestor) return true;
        for (let i = 0; i < ancestor.children.length; i++) {
          if (isDescendantOf(node, ancestor.children[i])) return true;
        }
        return false;
      }

      function clientToWorld(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        return {
          x: (clientX - rect.left - tx) / scale,
          y: (clientY - rect.top - ty) / scale,
        };
      }

      function canStartNodeDrag(node, mode) {
        return (
          !!node &&
          node !== tree &&
          canEdit() &&
          (mode === "select" || mode === "title" || mode === "desc")
        );
      }

      function findDropTarget(wx, wy, dragged) {
        if (!dragged || !tree) return null;
        let best = null;
        let bestDist = Infinity;

        function visit(node) {
          if (node === dragged) return;
          if (!node.style) {
            if (node.open) node.children.forEach(visit);
            return;
          }
          const padX = 28;
          const padY = Math.max(GAP_Y, 14);
          const left = node.x - padX;
          const right = node.x + node.w + GAP_X;
          const top = node.y - padY;
          const bottom = node.y + node.h + padY;
          if (wx >= left && wx <= right && wy >= top && wy <= bottom) {
            const cx = node.x + node.w / 2;
            const cy = node.y + node.h / 2;
            const dist = Math.hypot(wx - cx, wy - cy);
            if (dist < bestDist) {
              bestDist = dist;
              best = node;
            }
          }
          if (node.open) node.children.forEach(visit);
        }

        visit(tree);
        if (!best) return null;
        if (isDescendantOf(best, dragged)) return null;

        if (best === tree) {
          return { type: "child", target: best };
        }

        const relY = (wy - best.y) / Math.max(best.h, 1);
        const towardChild = wx > best.x + best.w * 0.62;
        if (!towardChild && relY < 0.32) return { type: "before", target: best };
        if (!towardChild && relY > 0.68) return { type: "after", target: best };
        return { type: "child", target: best };
      }

      function moveNodeToDrop(node, drop) {
        if (!node || !drop || !drop.target || node === tree || !canEdit())
          return false;
        if (node === drop.target || isDescendantOf(drop.target, node))
          return false;

        const info = locate(node);
        if (!info || !info.parent) return false;

        let newParent;
        let newIndex;
        if (drop.type === "child") {
          newParent = drop.target;
          newIndex = newParent.children.length;
        } else {
          const tInfo = locate(drop.target);
          if (!tInfo || !tInfo.parent) return false;
          newParent = tInfo.parent;
          newIndex = drop.type === "before" ? tInfo.index : tInfo.index + 1;
        }

        if (isDescendantOf(newParent, node) || newParent === node) return false;

        if (info.parent === newParent) {
          if (info.index < newIndex) newIndex -= 1;
          if (newIndex === info.index) return false;
        }

        pushHistory();
        info.parent.children.splice(info.index, 1);
        newParent.children.splice(newIndex, 0, node);
        newParent.open = true;
        refreshDepth(tree, 0);
        selected = node;
        editing = false;
        editInput = null;
        editBaseline = null;
        // Pin the root so the pan stays put. Anchoring the moved node
        // would scroll the whole map by however far its slot changed.
        relayout(tree);
        saveLocal();
        return true;
      }

      function paintDragOverlay(layer, dragged, drop, wx, wy, grabDX, grabDY) {
        if (!dragged || !dragged.style) return;
        const gx = wx - grabDX;
        const gy = wy - grabDY;
        const ghost = document.createElementNS(NS, "g");
        ghost.setAttribute("opacity", "0.55");
        ghost.style.pointerEvents = "none";
        const bodyW = (dragged.iconW || 0) + dragged.labelW;
        const noteVisualW = dragged.noteW ? 16 : 0;
        const bg = document.createElementNS(NS, "rect");
        bg.setAttribute("x", gx - 10);
        bg.setAttribute("y", gy + 2);
        bg.setAttribute("width", Math.max(bodyW + noteVisualW, 48) + 20);
        bg.setAttribute("height", dragged.h - 4);
        bg.setAttribute("rx", 4);
        bg.setAttribute("fill", "var(--map-sel)");
        ghost.appendChild(bg);
        const label = document.createElementNS(NS, "text");
        label.setAttribute("x", gx + (dragged.iconW || 0));
        label.setAttribute("y", gy + dragged.h / 2);
        label.setAttribute("dominant-baseline", "central");
        label.setAttribute("fill", dragged.style.fill);
        label.setAttribute("font-family", dragged.style.family);
        label.setAttribute("font-size", dragged.style.size);
        label.setAttribute("font-weight", dragged.style.weight);
        label.textContent = dragged.title || " ";
        ghost.appendChild(label);
        layer.appendChild(ghost);

        if (!drop || !drop.target || !drop.target.style) return;
        const target = drop.target;
        if (drop.type === "child") {
          const body = (target.iconW || 0) + target.labelW;
          const noteW = target.noteW ? 16 : 0;
          const hl = document.createElementNS(NS, "rect");
          hl.setAttribute("x", target.x - 10);
          hl.setAttribute("y", target.y + 2);
          hl.setAttribute("width", Math.max(body + noteW, 48) + 20);
          hl.setAttribute("height", target.h - 4);
          hl.setAttribute("rx", 4);
          hl.setAttribute("fill", "var(--map-drop-fill)");
          hl.setAttribute("stroke", "var(--map-drop)");
          hl.setAttribute("stroke-width", 1.4);
          hl.setAttribute("stroke-dasharray", "4 3");
          hl.style.pointerEvents = "none";
          layer.appendChild(hl);
          const tip = document.createElementNS(NS, "circle");
          tip.setAttribute("cx", target.x + target.w + 10);
          tip.setAttribute("cy", target.y + target.h / 2);
          tip.setAttribute("r", 4);
          tip.setAttribute("fill", "var(--map-drop)");
          tip.style.pointerEvents = "none";
          layer.appendChild(tip);
          return;
        }

        const y =
          drop.type === "before"
            ? target.y - 4
            : target.y + target.h + 4;
        const line = document.createElementNS(NS, "path");
        line.setAttribute(
          "d",
          "M " +
            (target.x - 6) +
            " " +
            y +
            " H " +
            (target.x + Math.max(target.w, 40) + 6),
        );
        line.setAttribute("stroke", "var(--map-drop)");
        line.setAttribute("stroke-width", 2.2);
        line.setAttribute("stroke-linecap", "round");
        line.setAttribute("fill", "none");
        line.style.pointerEvents = "none";
        layer.appendChild(line);
        const cap = document.createElementNS(NS, "circle");
        cap.setAttribute("cx", target.x - 6);
        cap.setAttribute("cy", y);
        cap.setAttribute("r", 3.2);
        cap.setAttribute("fill", "var(--map-drop)");
        cap.style.pointerEvents = "none";
        layer.appendChild(cap);
      }

      function updateChrome() {
        updateHistoryChrome();
        updateCtxMenuChrome();
      }

      function updateCtxMenuChrome() {
        const has = !!selected && !editing && canEdit();
        const isRoot = selected === tree;
        ctxMenu.querySelector('[data-act="rename"]').disabled = !has;
        ctxMenu.querySelector('[data-act="desc"]').disabled = !has;
        ctxMenu.querySelector('[data-act="note"]').disabled = !has;
        ctxMenu.querySelector('[data-act="child"]').disabled = !has;
        ctxMenu.querySelector('[data-act="sibling"]').disabled = !has || isRoot;
        ctxMenu.querySelector('[data-act="copy"]').disabled = !has;
        ctxMenu.querySelector('[data-act="cut"]').disabled = !has || isRoot;
        ctxMenu.querySelector('[data-act="paste"]').disabled = !has;
        ctxMenu.querySelector('[data-act="delete"]').disabled = !has || isRoot;
      }

      const measureCanvas = document.createElement("canvas").getContext("2d");
      function textWidth(text, font) {
        measureCanvas.font = font;
        return Math.ceil(measureCanvas.measureText(text).width);
      }

      function layout(node) {
        const depth = Math.min(node.depth, styles.length - 1);
        node.style = styles[depth];
        const editingHere = editing && node === selected && editInput;
        const title =
          editingHere && editField === "title"
            ? editInput.value || " "
            : node.title || " ";
        const desc =
          editingHere && editField === "desc"
            ? editInput.value || ""
            : descText(node);
        // Only grow height when subtitle text exists — empty desc edit overlays
        // without shifting sibling layout on activate.
        const showSub = !!desc;
        node.labelW = textWidth(
          title,
          node.style.weight + " " + node.style.size + "px " + node.style.family,
        );
        if (showSub) {
          const subW = textWidth(
            desc || " ",
            "400 " + DESC_SIZE + "px " + sans,
          );
          node.labelW = Math.max(node.labelW, subW);
          node.h = node.style.h + DESC_SIZE + DESC_GAP;
        } else {
          node.h = node.style.h;
        }
        node.hasChildren = node.children.length > 0;
        node.marker = node.hasChildren && !node.open ? node.children.length : 0;
        node.markerW = node.hasChildren
          ? 24 +
            (node.marker
              ? textWidth(String(node.marker), "400 13px " + sans) + 8
              : 0)
          : 0;
        node.iconW = NODE_ICON_W;
        node.noteW = nodeHasNote(node) ? NOTE_ICON_W : 0;
        node.w = node.iconW + node.labelW + node.noteW + node.markerW;
        if (!node.open || !node.hasChildren) {
          node.subtreeH = node.h;
          return;
        }
        node.children.forEach(layout);
        const inner =
          node.children.reduce((sum, child) => sum + child.subtreeH, 0) +
          GAP_Y * (node.children.length - 1);
        node.subtreeH = Math.max(node.h, inner);
      }

      function place(node, x, top) {
        node.x = x;
        if (!node.open || !node.hasChildren) {
          node.y = top + (node.subtreeH - node.h) / 2;
          return;
        }
        const inner =
          node.children.reduce((sum, child) => sum + child.subtreeH, 0) +
          GAP_Y * (node.children.length - 1);
        let y = top + (node.subtreeH - inner) / 2;
        node.children.forEach((child) => {
          place(child, x + node.w + GAP_X, y);
          y += child.subtreeH + GAP_Y;
        });
        const first = node.children[0];
        const last = node.children[node.children.length - 1];
        const mid = (first.y + first.h / 2 + last.y + last.h / 2) / 2;
        node.y = mid - node.h / 2;
      }

      let tx = 48;
      let ty = 36;
      let scale = 1;

      function screenPoint(x, y) {
        return { x: tx + x * scale, y: ty + y * scale };
      }

      function hideCtxMenu() {
        ctxMenu.classList.remove("show");
      }

      function positionNotePop(anchor) {
        const pad = 8;
        const width = notePop.offsetWidth || 280;
        const height = notePop.offsetHeight || 160;
        let left = anchor.left;
        let top = anchor.bottom + 8;
        if (left + width > window.innerWidth - pad)
          left = window.innerWidth - width - pad;
        if (top + height > window.innerHeight - pad)
          top = Math.max(pad, anchor.top - height - 8);
        if (left < pad) left = pad;
        if (top < pad) top = pad;
        notePop.style.left = `${left}px`;
        notePop.style.top = `${top}px`;
      }

      function noteAnchorRect() {
        if (!noteNode || !noteNode.style) {
          return { left: window.innerWidth / 2 - 140, top: 80, bottom: 100 };
        }
        const x = noteNode.x + (noteNode.iconW || 0) + noteNode.labelW + 4;
        const y = noteNode.y + noteNode.h / 2;
        const pt = screenPoint(x, y);
        return { left: pt.x, top: pt.y - 10, bottom: pt.y + 10 };
      }

      function syncNotePopContent() {
        const text = noteText(noteNode);
        noteView.textContent = text;
        noteEdit.value = text;
        notePop.classList.toggle("editing", noteEditing);
        noteFoot.hidden = !noteEditing;
      }

      function openNote(node, options = {}) {
        if (!node) return;
        const wantEdit = options.edit == null ? canEdit() : !!options.edit;
        const edit = !!(wantEdit && canEdit());
        const clientX = options.clientX;
        const clientY = options.clientY;
        if (editing) commitEdit(true);
        hideCtxMenu();
        hideIconPop();
        if (noteNode && noteNode !== node && noteEditing) commitNote(true);
        selected = node;
        noteNode = node;
        noteEditing = !!edit;
        noteBaseline = noteEditing ? currentSnapshot() : null;
        syncNotePopContent();
        notePop.classList.add("show");
        const anchor =
          clientX != null
            ? { left: clientX, top: clientY, bottom: clientY }
            : noteAnchorRect();
        positionNotePop(anchor);
        updateChrome();
        draw();
        if (noteEditing) {
          requestAnimationFrame(() => {
            noteEdit.focus();
            noteEdit.setSelectionRange(
              noteEdit.value.length,
              noteEdit.value.length,
            );
          });
        }
      }

      function commitNote(save) {
        if (!noteNode) {
          hideNotePop();
          return;
        }
        const node = noteNode;
        const normalized = noteEdit.value
          .replace(/\r\n/g, "\n")
          .replace(/[ \t]+$/gm, "")
          .replace(/^\n+|\n+$/g, "");
        const prev = noteText(node);
        const changed = save && normalized !== prev;
        if (save && changed) {
          if (noteBaseline) history.push(noteBaseline);
          if (normalized) node.note = normalized;
          else delete node.note;
        }
        noteEditing = false;
        noteBaseline = null;
        noteNode = null;
        notePop.classList.remove("show", "editing");
        noteFoot.hidden = true;
        relayout(node);
        saveLocal();
        updateHistoryChrome();
      }

      function hideNotePop({ save = true } = {}) {
        if (!notePop.classList.contains("show")) return;
        if (noteEditing && save) {
          commitNote(true);
          return;
        }
        noteEditing = false;
        noteBaseline = null;
        noteNode = null;
        notePop.classList.remove("show", "editing");
        noteFoot.hidden = true;
      }

      function isSecondaryPointer(event) {
        return event.button === 2 || (event.button === 0 && event.ctrlKey);
      }

      function hideIconPop() {
        iconPop.classList.remove("show");
        iconNode = null;
      }

      function positionIconPop(anchor) {
        const pad = 8;
        const width = iconPop.offsetWidth || 360;
        const height = iconPop.offsetHeight || 320;
        let left = anchor.left;
        let top = anchor.bottom + 8;
        if (left + width > window.innerWidth - pad)
          left = window.innerWidth - width - pad;
        if (top + height > window.innerHeight - pad)
          top = Math.max(pad, anchor.top - height - 8);
        if (left < pad) left = pad;
        if (top < pad) top = pad;
        iconPop.style.left = `${left}px`;
        iconPop.style.top = `${top}px`;
      }

      function emojisForTab(tabId) {
        if (tabId === "recent") return recentIcons.load();
        const cat = EMOJI_CATEGORIES.find((item) => item.id === tabId);
        return cat ? cat.emojis : [];
      }

      function renderIconTabs() {
        iconTabs.replaceChildren();
        ICON_TABS.forEach((tab) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("role", "tab");
          btn.textContent = tab.label;
          btn.className = tab.id === iconTabId ? "active" : "";
          btn.setAttribute(
            "aria-selected",
            tab.id === iconTabId ? "true" : "false",
          );
          btn.addEventListener("click", () => {
            iconTabId = tab.id;
            iconQuery = "";
            iconSearch.value = "";
            renderIconTabs();
            renderIconGrid();
            btn.scrollIntoView({ inline: "nearest", block: "nearest" });
          });
          iconTabs.appendChild(btn);
        });
      }

      function renderIconGrid() {
        const query = iconQuery.trim();
        const emojis = query ? searchEmojis(query) : emojisForTab(iconTabId);
        iconGrid.replaceChildren();
        if (!emojis.length) {
          const empty = document.createElement("p");
          empty.className = "icon-empty";
          empty.textContent = query
            ? "没有匹配的图标"
            : iconTabId === "recent"
              ? "还没有最近使用，选一个会出现在这里"
              : "暂无图标";
          iconGrid.appendChild(empty);
          return;
        }
        emojis.forEach((emoji) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = emoji;
          btn.addEventListener("click", () => applyNodeIcon(emoji));
          iconGrid.appendChild(btn);
        });
      }

      function renderIconPicker() {
        renderIconTabs();
        renderIconGrid();
      }

      function openIconPicker(node, event) {
        if (!node || !canEdit()) return;
        if (editing) commitEdit(true);
        hideCtxMenu();
        hideNotePop({ save: true });
        selected = node;
        iconNode = node;
        iconTabId = "recent";
        iconQuery = "";
        iconSearch.value = "";
        renderIconPicker();
        iconPop.classList.add("show");
        const anchor = event
          ? { left: event.clientX, top: event.clientY, bottom: event.clientY }
          : (() => {
              const pt = screenPoint(node.x, node.y + node.h / 2);
              return { left: pt.x, top: pt.y - 12, bottom: pt.y + 12 };
            })();
        positionIconPop(anchor);
        requestAnimationFrame(() => {
          iconSearch.focus();
        });
        updateChrome();
        draw();
      }

      function applyNodeIcon(emoji) {
        if (!iconNode || !canEdit()) return;
        const node = iconNode;
        const next = String(emoji || "").trim();
        const prev = iconText(node);
        if (next === prev) {
          hideIconPop();
          draw();
          return;
        }
        pushHistory();
        if (next) {
          node.icon = next;
          recentIcons.push(next);
        } else {
          delete node.icon;
        }
        hideIconPop();
        relayout(node);
        saveLocal();
      }

      function clearNodeIcon() {
        applyNodeIcon("");
      }

      function showCtxMenu(clientX, clientY, node) {
        if (!node || editing || !canEdit()) return;
        clearLongPress();
        hideNotePop({ save: true });
        hideIconPop();
        if (selected !== node) {
          selected = node;
          draw();
        } else {
          updateChrome();
        }
        updateCtxMenuChrome();
        ctxMenu.classList.add("show");
        const pad = 8;
        const width = ctxMenu.offsetWidth || 180;
        const height = ctxMenu.offsetHeight || 180;
        let left = clientX;
        let top = clientY;
        if (left + width > window.innerWidth - pad)
          left = window.innerWidth - width - pad;
        if (top + height > window.innerHeight - pad)
          top = window.innerHeight - height - pad;
        if (left < pad) left = pad;
        if (top < pad) top = pad;
        ctxMenu.style.left = `${left}px`;
        ctxMenu.style.top = `${top}px`;
      }

      function nodeFromEventTarget(target) {
        const host =
          target && target.closest && target.closest("[data-node-path]");
        if (!host) return null;
        const raw = host.getAttribute("data-node-path");
        if (raw === "") return tree;
        return nodeAtPath(tree, raw.split(",").map(Number));
      }

      function clearLongPress() {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        longPressArmed = false;
      }

      function armLongPress(event, node) {
        if (editing || !canEdit()) return;
        if (event.pointerType !== "touch") return;
        clearLongPress();
        longPressArmed = true;
        const x = event.clientX;
        const y = event.clientY;
        const pointerId = event.pointerId;
        longPressTimer = setTimeout(() => {
          if (!longPressArmed || (drag && drag.moved)) return;
          longPressArmed = false;
          longPressTimer = null;
          suppressNextTap = true;
          drag = null;
          svg.classList.remove("dragging");
          try {
            svg.releasePointerCapture(pointerId);
          } catch (_) {}
          if (!canEdit()) return;
          showCtxMenu(x, y, node);
        }, LONG_PRESS_MS);
      }

      function bindSubtitleGesture(group, node, textX, contentTop) {
        const sub = descText(node);
        if (!sub) return;
        const subW = textWidth(sub, "400 " + DESC_SIZE + "px " + sans);
        const hitY = contentTop + node.style.size + DESC_GAP;
        const subHit = document.createElementNS(NS, "rect");
        subHit.setAttribute("x", textX);
        subHit.setAttribute("y", hitY);
        subHit.setAttribute("width", Math.max(subW, 1));
        subHit.setAttribute("height", DESC_SIZE);
        subHit.setAttribute("fill", "transparent");
        subHit.setAttribute("data-field", "desc");
        subHit.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
          if (isSecondaryPointer(event)) return;
          armDrag(event, node, "desc");
        });
        group.appendChild(subHit);
      }

      function draw() {
        const activeValue = editing && editInput ? editInput.value : null;
        const selectionStart =
          editing && editInput ? editInput.selectionStart : null;
        const selectionEnd =
          editing && editInput ? editInput.selectionEnd : null;

        viewport.replaceChildren();
        const links = document.createElementNS(NS, "g");
        const nodes = document.createElementNS(NS, "g");
        viewport.append(links, nodes);

        function visit(node) {
          if (!node.style) return;
          if (node.open) {
            node.children.forEach((child) => {
              if (!child.style) return;
              const x1 = node.x + node.w;
              const y1 = node.y + node.h / 2;
              const x2 = child.x;
              const y2 = child.y + child.h / 2;
              const bend = Math.max(20, (x2 - x1) * 0.46);
              const path = document.createElementNS(NS, "path");
              path.setAttribute(
                "d",
                "M " +
                  x1 +
                  " " +
                  y1 +
                  " C " +
                  (x1 + bend) +
                  " " +
                  y1 +
                  ", " +
                  (x2 - bend) +
                  " " +
                  y2 +
                  ", " +
                  x2 +
                  " " +
                  y2,
              );
              path.setAttribute("fill", "none");
              path.setAttribute("stroke", "var(--map-ink)");
              path.setAttribute("stroke-width", node.depth === 0 ? 1.6 : 1);
              links.appendChild(path);
              visit(child);
            });
          }

          const group = document.createElementNS(NS, "g");
          group.style.cursor = "pointer";
          const nodePath = pathToNode(tree, node);
          group.setAttribute(
            "data-node-path",
            nodePath ? nodePath.join(",") : "",
          );
          if (
            drag &&
            drag.kind === "node" &&
            (node === drag.node || isDescendantOf(node, drag.node))
          ) {
            group.setAttribute("opacity", "0.28");
          }
          const isEditingNode = editing && node === selected;
          const showSub = nodeShowsSubtitle(node);
          const layoutHasSub = node.h > node.style.h;
          const contentH = layoutHasSub
            ? node.style.size + DESC_GAP + DESC_SIZE
            : node.style.size;
          const contentTop = node.y + (node.h - contentH) / 2;
          const titleY = contentTop + node.style.size / 2;
          const subY =
            contentTop + node.style.size + DESC_GAP + DESC_SIZE / 2;
          const textX = node.x + (node.iconW || 0);
          const bodyW = (node.iconW || 0) + node.labelW;
          const noteVisualW = node.noteW ? 16 : 0;
          const editPadX = 4;
          const editMinW = 28;

          const bodyHitX = node.x - 10;
          const bodyHitY = node.y + 2;
          const bodyHitW = Math.max(bodyW + noteVisualW, 48) + 20;
          const bodyHitH = node.h - 4;

          if (node === selected || isEditingNode || iconNode === node) {
            const sel = document.createElementNS(NS, "rect");
            sel.setAttribute("x", bodyHitX);
            sel.setAttribute("y", bodyHitY);
            sel.setAttribute("width", bodyHitW);
            sel.setAttribute("height", bodyHitH);
            sel.setAttribute("rx", 4);
            sel.setAttribute("fill", "var(--map-sel)");
            sel.style.pointerEvents = "none";
            group.appendChild(sel);
          }

          if (!isEditingNode) {
            const bodyHit = document.createElementNS(NS, "rect");
            bodyHit.setAttribute("x", bodyHitX);
            bodyHit.setAttribute("y", bodyHitY);
            bodyHit.setAttribute("width", bodyHitW);
            bodyHit.setAttribute("height", bodyHitH);
            bodyHit.setAttribute("fill", "transparent");
            group.appendChild(bodyHit);
          }

          {
            const iconCx = node.x + (node.iconW || NODE_ICON_W) / 2 - 1;
            const hasIcon = !!iconText(node);
            const iconSize = hasIcon
              ? Math.max(14, Math.min(18, node.style.size - 2))
              : 12;
            // Color emoji paints high in the em box; match hit box to ink.
            const iconDy = hasIcon ? iconSize * 0.08 : 0;
            const iconHit = document.createElementNS(NS, "rect");
            iconHit.setAttribute("x", iconCx - iconSize / 2);
            iconHit.setAttribute("y", titleY - iconSize / 2 + iconDy);
            iconHit.setAttribute("width", iconSize);
            iconHit.setAttribute("height", iconSize);
            iconHit.setAttribute("fill", "transparent");
            iconHit.style.cursor = "pointer";
            iconHit.addEventListener("pointerdown", (event) => {
              event.stopPropagation();
              if (isSecondaryPointer(event)) return;
              if (!canEdit()) {
                armDrag(event, node, "select");
                return;
              }
              event.preventDefault();
              openIconPicker(node, event);
            });
            group.appendChild(iconHit);

            const iconLabel = document.createElementNS(NS, "text");
            iconLabel.setAttribute("x", iconCx);
            iconLabel.setAttribute("y", titleY);
            iconLabel.setAttribute("text-anchor", "middle");
            iconLabel.setAttribute("dominant-baseline", "central");
            iconLabel.setAttribute("font-size", iconSize);
            iconLabel.style.pointerEvents = "none";
            if (hasIcon) {
              iconLabel.textContent = iconText(node);
              iconLabel.setAttribute("dy", iconDy.toFixed(2));
            } else {
              iconLabel.textContent = "○";
              iconLabel.setAttribute("fill", "var(--map-faint)");
              iconLabel.setAttribute("font-family", sans);
            }
            group.appendChild(iconLabel);
          }

          if (!isEditingNode) {
            const titleW = textWidth(
              node.title || " ",
              node.style.weight +
                " " +
                node.style.size +
                "px " +
                node.style.family,
            );
            const titleHit = document.createElementNS(NS, "rect");
            titleHit.setAttribute("x", textX);
            titleHit.setAttribute("y", contentTop);
            titleHit.setAttribute("width", Math.max(titleW, 1));
            titleHit.setAttribute("height", node.style.size);
            titleHit.setAttribute("fill", "transparent");
            titleHit.setAttribute("data-field", "title");
            titleHit.addEventListener("pointerdown", (event) => {
              event.stopPropagation();
              if (isSecondaryPointer(event)) return;
              armDrag(event, node, "title");
            });
            group.appendChild(titleHit);

            const label = document.createElementNS(NS, "text");
            label.setAttribute("x", textX);
            label.setAttribute("y", titleY);
            label.setAttribute("dominant-baseline", "central");
            label.setAttribute("fill", node.style.fill);
            label.setAttribute("font-family", node.style.family);
            label.setAttribute("font-size", node.style.size);
            label.setAttribute("font-weight", node.style.weight);
            label.style.pointerEvents = "none";
            label.textContent = node.title;
            group.appendChild(label);

            if (showSub) {
              const sub = document.createElementNS(NS, "text");
              sub.setAttribute("x", textX);
              sub.setAttribute("y", subY);
              sub.setAttribute("dominant-baseline", "central");
              sub.setAttribute("fill", "var(--map-muted)");
              sub.setAttribute("font-family", sans);
              sub.setAttribute("font-size", DESC_SIZE);
              sub.setAttribute("font-weight", 400);
              sub.style.pointerEvents = "none";
              sub.textContent = descText(node);
              group.appendChild(sub);
              bindSubtitleGesture(group, node, textX, contentTop);
            }
          } else {
            const editingTitle = editField === "title";
            const editingSub = editField === "desc";
            const placeholderW =
              editingSub && !descText(node)
                ? textWidth("副标题", "400 " + DESC_SIZE + "px " + sans)
                : 0;
            const editW = Math.max(
              node.labelW + editPadX * 2,
              placeholderW + editPadX * 2,
              editMinW,
            );

            if (editingTitle) {
              const fo = document.createElementNS(NS, "foreignObject");
              fo.setAttribute("x", textX - editPadX);
              fo.setAttribute("y", contentTop);
              fo.setAttribute("width", editW);
              fo.setAttribute("height", node.style.size + 2);
              const input = document.createElement("input");
              input.className = "inline-edit";
              input.type = "text";
              input.autocomplete = "off";
              input.spellcheck = false;
              input.value = activeValue != null ? activeValue : node.title;
              input.style.fontFamily = node.style.family;
              input.style.fontSize = node.style.size + "px";
              input.style.fontWeight = node.style.weight;
              fo.appendChild(input);
              group.appendChild(fo);
              editInput = input;
            } else {
              const label = document.createElementNS(NS, "text");
              label.setAttribute("x", textX);
              label.setAttribute("y", titleY);
              label.setAttribute("dominant-baseline", "central");
              label.setAttribute("fill", node.style.fill);
              label.setAttribute("font-family", node.style.family);
              label.setAttribute("font-size", node.style.size);
              label.setAttribute("font-weight", node.style.weight);
              label.textContent = node.title;
              group.appendChild(label);
            }

            if (editingSub) {
              const fo = document.createElementNS(NS, "foreignObject");
              fo.setAttribute("x", textX - editPadX);
              fo.setAttribute(
                "y",
                contentTop + node.style.size + DESC_GAP,
              );
              fo.setAttribute("width", editW);
              fo.setAttribute("height", DESC_SIZE + 2);
              const input = document.createElement("input");
              input.className = "inline-edit";
              input.type = "text";
              input.autocomplete = "off";
              input.spellcheck = false;
              input.placeholder = "副标题";
              input.value =
                activeValue != null ? activeValue : descText(node);
              input.style.fontFamily = sans;
              input.style.fontSize = DESC_SIZE + "px";
              input.style.fontWeight = 400;
              fo.appendChild(input);
              group.appendChild(fo);
              editInput = input;
            } else if (showSub) {
              const sub = document.createElementNS(NS, "text");
              sub.setAttribute("x", textX);
              sub.setAttribute("y", subY);
              sub.setAttribute("dominant-baseline", "central");
              sub.setAttribute("fill", "var(--map-muted)");
              sub.setAttribute("font-family", sans);
              sub.setAttribute("font-size", DESC_SIZE);
              sub.setAttribute("font-weight", 400);
              sub.textContent = descText(node);
              group.appendChild(sub);
            }

            if (editInput) {
              const input = editInput;
              const fo = input.parentNode;
              input.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                  event.preventDefault();
                  commitEdit(true);
                } else if (event.key === "Escape") {
                  event.preventDefault();
                  commitEdit(false);
                } else if (event.key === "Tab" && editField === "title") {
                  event.preventDefault();
                  commitEdit(true);
                  addChild(selected);
                }
              });
              input.addEventListener("input", () => {
                const value = input.value || " ";
                if (editField === "title") {
                  node.labelW = textWidth(
                    value,
                    node.style.weight +
                      " " +
                      node.style.size +
                      "px " +
                      node.style.family,
                  );
                  const subW = descText(node)
                    ? textWidth(
                        descText(node),
                        "400 " + DESC_SIZE + "px " + sans,
                      )
                    : 0;
                  node.labelW = Math.max(node.labelW, subW);
                } else {
                  const titleW = textWidth(
                    node.title || " ",
                    node.style.weight +
                      " " +
                      node.style.size +
                      "px " +
                      node.style.family,
                  );
                  const subW = textWidth(
                    value || " ",
                    "400 " + DESC_SIZE + "px " + sans,
                  );
                  node.labelW = Math.max(titleW, subW);
                }
                fo.setAttribute(
                  "width",
                  Math.max(node.labelW + editPadX * 2, editMinW),
                );
              });
              input.addEventListener("blur", () => {
                if (ignoreBlur) return;
                commitEdit(true);
              });

              requestAnimationFrame(() => {
                if (!editInput) return;
                editInput.focus();
                if (selectionStart != null && selectionEnd != null) {
                  try {
                    editInput.setSelectionRange(selectionStart, selectionEnd);
                  } catch (_) {
                    editInput.select();
                  }
                } else {
                  editInput.select();
                }
              });
            }
          }

          if (node.noteW) {
            const nx = node.x + (node.iconW || 0) + node.labelW + 11;
            const ny = node.y + node.h / 2;
            const noteIcon = document.createElementNS(NS, "g");
            noteIcon.style.cursor = "pointer";
            const noteHit = document.createElementNS(NS, "circle");
            noteHit.setAttribute("cx", nx);
            noteHit.setAttribute("cy", ny);
            noteHit.setAttribute("r", 10);
            noteHit.setAttribute("fill", "transparent");
            noteIcon.appendChild(noteHit);
            const paper = document.createElementNS(NS, "path");
            paper.setAttribute(
              "d",
              `M ${nx - 5} ${ny - 6} h 7 l 3 3 v 9 h -10 z M ${nx + 2} ${ny - 6} v 3 h 3`,
            );
            paper.setAttribute(
              "fill",
              noteNode === node && notePop.classList.contains("show")
                ? "var(--map-paper-active)"
                : "var(--map-paper)",
            );
            paper.setAttribute("stroke", "var(--map-paper-stroke)");
            paper.setAttribute("stroke-width", 1.2);
            paper.setAttribute("stroke-linejoin", "round");
            noteIcon.appendChild(paper);
            noteIcon.addEventListener("pointerdown", (event) => {
              event.stopPropagation();
              if (isSecondaryPointer(event)) return;
              event.preventDefault();
              openNote(node, {
                clientX: event.clientX,
                clientY: event.clientY,
              });
            });
            group.appendChild(noteIcon);
          }

          if (node.hasChildren) {
            const baseRight =
              (node.iconW || 0) + node.labelW + (node.noteW || 0);
            const mx = node.x + baseRight + 16;
            const my = node.y + node.h / 2;
            const mark = document.createElementNS(NS, "circle");
            mark.setAttribute("cx", mx);
            mark.setAttribute("cy", my);
            mark.setAttribute("r", 7);
            mark.setAttribute("fill", "var(--map-mark-fill)");
            mark.setAttribute("stroke", "var(--map-ink)");
            mark.setAttribute("stroke-width", 1.2);
            group.appendChild(mark);
            const hline = document.createElementNS(NS, "path");
            hline.setAttribute(
              "d",
              "M " + (mx - 3.2) + " " + my + " H " + (mx + 3.2),
            );
            hline.setAttribute("stroke", "var(--map-ink)");
            hline.setAttribute("stroke-width", 1.2);
            hline.setAttribute("fill", "none");
            group.appendChild(hline);
            if (!node.open) {
              const vline = document.createElementNS(NS, "path");
              vline.setAttribute(
                "d",
                "M " + mx + " " + (my - 3.2) + " V " + (my + 3.2),
              );
              vline.setAttribute("stroke", "var(--map-ink)");
              vline.setAttribute("stroke-width", 1.2);
              vline.setAttribute("fill", "none");
              group.appendChild(vline);
            }
            if (node.marker) {
              const count = document.createElementNS(NS, "text");
              count.setAttribute("x", mx + 14);
              count.setAttribute("y", my);
              count.setAttribute("dominant-baseline", "central");
              count.setAttribute("fill", "var(--map-muted)");
              count.setAttribute("font-family", sans);
              count.setAttribute("font-size", 13);
              count.setAttribute("font-weight", 400);
              count.textContent = String(node.marker);
              group.appendChild(count);
            }
            if (!isEditingNode) {
              const markHit = document.createElementNS(NS, "circle");
              markHit.setAttribute("cx", mx);
              markHit.setAttribute("cy", my);
              markHit.setAttribute("r", 12);
              markHit.setAttribute("fill", "transparent");
              markHit.style.cursor = "pointer";
              markHit.addEventListener("pointerdown", (event) => {
                event.stopPropagation();
                if (isSecondaryPointer(event)) return;
                armDrag(event, node, "toggle");
              });
              group.appendChild(markHit);
            }
          }

          if (!isEditingNode) {
            group.addEventListener("pointerdown", (event) => {
              event.stopPropagation();
              if (isSecondaryPointer(event)) return;
              armDrag(event, node, "select");
              armLongPress(event, node);
            });
          }
          nodes.appendChild(group);
        }

        visit(tree);
        if (drag && drag.kind === "node" && drag.node) {
          refreshDragOverlay();
        }
        apply();
        updateChrome();
      }

      function refreshDragOverlay() {
        const old = viewport.querySelector("[data-drag-ui]");
        if (old) old.remove();
        if (!drag || drag.kind !== "node" || !drag.node) return;
        const overlay = document.createElementNS(NS, "g");
        overlay.setAttribute("data-drag-ui", "1");
        paintDragOverlay(
          overlay,
          drag.node,
          drag.drop,
          drag.wx,
          drag.wy,
          drag.grabDX,
          drag.grabDY,
        );
        viewport.appendChild(overlay);
      }

      function apply() {
        viewport.setAttribute(
          "transform",
          "translate(" + tx + " " + ty + ") scale(" + scale + ")",
        );
      }

      function relayout(anchor) {
        const before = anchor ? anchor.y : 0;
        layout(tree);
        place(tree, 0, 0);
        if (anchor && anchor.y != null) ty += (before - anchor.y) * scale;
        draw();
      }

      let drag = null;
      // Hold Esc after cancelling a drag should not also clear the selection.
      let escapeUsedForDrag = false;
      const activePointers = new Map();
      let pinch = null;

      function zoomAt(px, py, next) {
        const clamped = Math.min(2.4, Math.max(0.35, next));
        if (clamped === scale) return;
        tx = px - ((px - tx) * clamped) / scale;
        ty = py - ((py - ty) * clamped) / scale;
        scale = clamped;
      }

      function pointerPair() {
        if (activePointers.size < 2) return null;
        const pts = Array.from(activePointers.values());
        return [pts[0], pts[1]];
      }

      function beginPinch() {
        const pair = pointerPair();
        if (!pair) return;
        clearLongPress();
        hideCtxMenu();
        const wasNodeDrag = drag && drag.kind === "node";
        drag = null;
        svg.classList.remove("node-dragging");
        svg.classList.add("dragging");
        if (wasNodeDrag) draw();
        const [a, b] = pair;
        const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        pinch = {
          dist,
          scale,
          tx,
          ty,
          midX: (a.x + b.x) / 2,
          midY: (a.y + b.y) / 2,
        };
      }

      function updatePinch() {
        const pair = pointerPair();
        if (!pair || !pinch) return;
        const [a, b] = pair;
        const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2;
        const rect = svg.getBoundingClientRect();
        const px = pinch.midX - rect.left;
        const py = pinch.midY - rect.top;
        scale = pinch.scale;
        tx = pinch.tx;
        ty = pinch.ty;
        zoomAt(px, py, pinch.scale * (dist / pinch.dist));
        tx += midX - pinch.midX;
        ty += midY - pinch.midY;
        apply();
      }

      function armDrag(event, node, mode) {
        if (editing) return;
        if (isSecondaryPointer(event)) return;
        hideCtxMenu();
        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
        });
        try {
          svg.setPointerCapture(event.pointerId);
        } catch (_) {}
        if (activePointers.size >= 2) {
          beginPinch();
          return;
        }
        pinch = null;
        drag = {
          x: event.clientX,
          y: event.clientY,
          tx,
          ty,
          moved: false,
          node,
          mode,
          kind: "pan",
          drop: null,
          wx: 0,
          wy: 0,
          grabDX: 0,
          grabDY: 0,
          pointerId: event.pointerId,
        };
      }
      svg.addEventListener("pointerdown", (event) => {
        if (editing) return;
        if (isSecondaryPointer(event)) return;
        if (!event.target.closest || !event.target.closest("[data-node-path]"))
          hideCtxMenu();
        armDrag(event, null, "pan");
      });
      svg.addEventListener("pointermove", (event) => {
        if (editing) return;
        if (activePointers.has(event.pointerId)) {
          activePointers.set(event.pointerId, {
            x: event.clientX,
            y: event.clientY,
          });
        }
        if (activePointers.size >= 2) {
          if (!pinch) beginPinch();
          updatePinch();
          return;
        }
        if (!drag) return;
        const dx = event.clientX - drag.x;
        const dy = event.clientY - drag.y;
        if (!drag.moved && Math.hypot(dx, dy) < 5) return;
        const firstMove = !drag.moved;
        drag.moved = true;
        clearLongPress();
        hideCtxMenu();

        if (firstMove && canStartNodeDrag(drag.node, drag.mode)) {
          const world = clientToWorld(event.clientX, event.clientY);
          drag.kind = "node";
          drag.wx = world.x;
          drag.wy = world.y;
          drag.grabDX = world.x - drag.node.x;
          drag.grabDY = world.y - drag.node.y;
          drag.drop = findDropTarget(world.x, world.y, drag.node);
          selected = drag.node;
          hideNotePop({ save: false });
          hideIconPop();
          svg.classList.add("node-dragging");
          svg.classList.remove("dragging");
          draw();
          return;
        }

        if (drag.kind === "node") {
          const world = clientToWorld(event.clientX, event.clientY);
          drag.wx = world.x;
          drag.wy = world.y;
          drag.drop = findDropTarget(world.x, world.y, drag.node);
          refreshDragOverlay();
          return;
        }

        svg.classList.add("dragging");
        tx = drag.tx + dx;
        ty = drag.ty + dy;
        apply();
      });
      function endDrag(event) {
        if (event && event.pointerId != null) {
          activePointers.delete(event.pointerId);
          try {
            svg.releasePointerCapture(event.pointerId);
          } catch (_) {}
        }
        if (pinch) {
          clearLongPress();
          if (activePointers.size >= 2) {
            beginPinch();
            return;
          }
          pinch = null;
          drag = null;
          svg.classList.remove("dragging");
          svg.classList.remove("node-dragging");
          if (activePointers.size === 1) {
            const [id, pt] = activePointers.entries().next().value;
            drag = {
              x: pt.x,
              y: pt.y,
              tx,
              ty,
              moved: true,
              node: null,
              mode: "pan",
              kind: "pan",
              drop: null,
              wx: 0,
              wy: 0,
              grabDX: 0,
              grabDY: 0,
              pointerId: id,
            };
          }
          return;
        }
        clearLongPress();
        if (suppressNextTap) {
          suppressNextTap = false;
          drag = null;
          svg.classList.remove("dragging");
          svg.classList.remove("node-dragging");
          return;
        }
        if (drag && drag.moved && drag.kind === "node") {
          const drop = drag.drop;
          const node = drag.node;
          drag = null;
          svg.classList.remove("dragging");
          svg.classList.remove("node-dragging");
          if (!moveNodeToDrop(node, drop)) draw();
          return;
        }
        if (drag && !drag.moved && drag.node) {
          if (drag.mode === "toggle") {
            hideCtxMenu();
            drag.node.open = !drag.node.open;
            selected = drag.node;
            relayout(drag.node);
            saveLocal();
          } else if (drag.mode === "title" || drag.mode === "desc") {
            const field = drag.mode === "desc" ? "desc" : "title";
            hideCtxMenu();
            if (!canEdit()) {
              selected = drag.node;
              draw();
            } else {
              beginEdit(drag.node, field);
            }
          } else if (drag.mode === "select") {
            hideCtxMenu();
            selected = drag.node;
            draw();
          }
        } else if (drag && !drag.moved && !drag.node) {
          selected = null;
          hideCtxMenu();
          draw();
        }
        drag = null;
        svg.classList.remove("dragging");
        svg.classList.remove("node-dragging");
      }
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", (event) => {
        clearLongPress();
        if (event && event.pointerId != null) {
          activePointers.delete(event.pointerId);
        } else {
          activePointers.clear();
        }
        pinch = null;
        const wasNodeDrag = drag && drag.kind === "node";
        drag = null;
        svg.classList.remove("dragging");
        svg.classList.remove("node-dragging");
        if (wasNodeDrag) draw();
      });

      function cancelNodeDrag() {
        if (!drag || drag.kind !== "node") return false;
        clearLongPress();
        // Leave pointer capture in place so the later pointerup cannot
        // land on a toolbar control. endDrag sees drag === null and does
        // not call moveNodeToDrop.
        drag = null;
        svg.classList.remove("dragging");
        svg.classList.remove("node-dragging");
        draw();
        return true;
      }
      svg.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        const node = nodeFromEventTarget(event.target);
        if (!node || !canEdit()) {
          hideCtxMenu();
          if (node) {
            selected = node;
            draw();
          }
          return;
        }
        showCtxMenu(event.clientX, event.clientY, node);
      });
      svg.addEventListener(
        "wheel",
        (event) => {
          if (editing) return;
          event.preventDefault();
          if (event.ctrlKey || event.metaKey) {
            const rect = svg.getBoundingClientRect();
            zoomAt(
              event.clientX - rect.left,
              event.clientY - rect.top,
              scale * (event.deltaY < 0 ? 1.08 : 0.92),
            );
          } else {
            tx -= event.deltaX;
            ty -= event.deltaY;
          }
          apply();
        },
        { passive: false },
      );

      function bounds() {
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        (function scan(node) {
          if (!node.style) return;
          minX = Math.min(minX, node.x);
          minY = Math.min(minY, node.y);
          maxX = Math.max(maxX, node.x + node.w);
          maxY = Math.max(maxY, node.y + node.h);
          if (node.open) node.children.forEach(scan);
        })(tree);
        return { minX, minY, w: maxX - minX, h: maxY - minY };
      }

      function frame() {
        layout(tree);
        place(tree, 0, 0);
        const box = bounds();
        const pad = 40;
        const fitW = (window.innerWidth - pad * 2) / Math.max(box.w, 1);
        const fitH = (window.innerHeight - pad * 2) / Math.max(box.h, 1);
        const fit = Math.min(fitW, fitH);
        scale = Math.min(
          1,
          Number.isFinite(fit) ? (fit >= 0.78 ? fit : fitW) : 1,
        );
        if (!Number.isFinite(scale) || scale <= 0) scale = 1;
        tx = (window.innerWidth - box.w * scale) / 2 - box.minX * scale;
        const fittedH = box.h * scale;
        ty =
          fittedH < window.innerHeight - pad
            ? (window.innerHeight - fittedH) / 2 - box.minY * scale
            : window.innerHeight / 2 - (tree.y + tree.h / 2) * scale;
        draw();
      }

      function beginEdit(node, field = "title") {
        if (!node || !canEdit()) return;
        hideCtxMenu();
        hideNotePop({ save: true });
        hideIconPop();
        const nextField = field === "desc" ? "desc" : "title";
        if (editing && selected === node && editField === nextField) {
          editInput && editInput.focus();
          return;
        }
        if (editing) commitEdit(true);
        selected = node;
        editing = true;
        editField = nextField;
        editInput = null;
        editBaseline = currentSnapshot();
        layout(tree);
        place(tree, 0, 0);
        draw();
      }

      function commitEdit(save) {
        if (!editing) return;
        const node = selected;
        const field = editField;
        const raw = editInput
          ? editInput.value.replace(/\s+/g, " ").trim()
          : "";
        const baselineNode = editBaseline
          ? editBaseline.selectedPath && editBaseline.selectedPath.length
            ? nodeAtPath(editBaseline.tree, editBaseline.selectedPath)
            : editBaseline.tree
          : null;
        let changed = false;
        if (save && node && baselineNode) {
          if (field === "desc") {
            const prev = baselineNode.desc
              ? String(baselineNode.desc).trim()
              : "";
            changed = raw !== prev;
          } else {
            const nextTitle = raw || "未命名";
            changed = nextTitle !== baselineNode.title;
          }
        }
        ignoreBlur = true;
        editing = false;
        editInput = null;
        editField = "title";
        if (save && node) {
          if (changed && editBaseline) history.push(editBaseline);
          if (field === "desc") {
            if (raw) node.desc = raw;
            else delete node.desc;
          } else {
            node.title = raw || "未命名";
          }
          if (node === tree) {
            document.title = pageTitleOf(tree) + " · mm";
            svg.setAttribute("aria-label", pageTitleOf(tree));
          }
        }
        editBaseline = null;
        relayout(node);
        saveLocal();
        updateHistoryChrome();
        requestAnimationFrame(() => {
          ignoreBlur = false;
        });
      }

      function addChild(parent) {
        if (!parent || !canEdit()) return;
        if (editing) commitEdit(true);
        pushHistory();
        const child = {
          title: "新节点",
          children: [],
          open: true,
          depth: (parent.depth || 0) + 1,
        };
        parent.children.push(child);
        parent.open = true;
        refreshDepth(tree, 0);
        selected = child;
        editing = true;
        editField = "title";
        editInput = null;
        editBaseline = currentSnapshot();
        layout(tree);
        place(tree, 0, 0);
        draw();
        saveLocal();
      }

      function addSibling(node) {
        const info = locate(node);
        if (!info || !info.parent || !canEdit()) return;
        if (editing) commitEdit(true);
        pushHistory();
        const sibling = { title: "新节点", children: [], open: true };
        info.parent.children.splice(info.index + 1, 0, sibling);
        refreshDepth(tree, 0);
        selected = sibling;
        editing = true;
        editField = "title";
        editInput = null;
        editBaseline = currentSnapshot();
        layout(tree);
        place(tree, 0, 0);
        draw();
        saveLocal();
      }

      function markSubtreeOpen(node) {
        node.open = true;
        (node.children || []).forEach(markSubtreeOpen);
      }

      function clipboardUiBlocked() {
        return (
          notePop.classList.contains("show") ||
          iconPop.classList.contains("show") ||
          confirmModal.classList.contains("show") ||
          downloadModal.classList.contains("show") ||
          shareModal.classList.contains("show")
        );
      }

      function isTypingTarget(target) {
        const tag = target && target.tagName;
        return (
          tag === "INPUT" ||
          tag === "TEXTAREA" ||
          !!(target && target.isContentEditable)
        );
      }

      /** Paste Markdown / indented outline under a node as a tree branch. */
      function pasteOutline(parent, text) {
        if (!parent || !canEdit()) return false;
        let children;
        try {
          children = parseOutlinePaste(text);
        } catch (error) {
          toast(error.message || String(error));
          return false;
        }
        if (!children.length) return false;
        if (editing) commitEdit(true);
        hideCtxMenu();
        hideNotePop({ save: false });
        hideIconPop();
        pushHistory();
        children.forEach(markSubtreeOpen);
        parent.children.push(...children);
        parent.open = true;
        refreshDepth(tree, 0);
        selected = children[0];
        editing = false;
        editInput = null;
        editBaseline = null;
        layout(tree);
        place(tree, 0, 0);
        draw();
        saveLocal();
        const added = children.reduce((sum, child) => sum + countNodes(child), 0);
        toast(`已粘贴 ${added} 个节点`);
        return true;
      }

      function writeNodeClipboard(node) {
        if (!node) return "";
        const text = subtreeToOutline(node);
        nodeClipboardText = text;
        return text;
      }

      async function copyNode(node, { silent = false } = {}) {
        if (!node) return false;
        const text = writeNodeClipboard(node);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          }
        } catch {
          /* memory fallback kept in nodeClipboardText */
        }
        if (!silent) toast("已复制");
        return true;
      }

      async function cutNode(node) {
        if (!node || !canEdit()) return false;
        if (node === tree) {
          toast("不能剪切中心节点");
          return false;
        }
        await copyNode(node, { silent: true });
        deleteNode(node, { silent: true });
        toast("已剪切");
        return true;
      }

      async function pasteNode(parent) {
        if (!parent || !canEdit()) return false;
        let text = "";
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            text = await navigator.clipboard.readText();
          }
        } catch {
          text = "";
        }
        if (!looksLikeOutlinePaste(text)) text = nodeClipboardText;
        if (!looksLikeOutlinePaste(text)) {
          toast("剪贴板没有可粘贴的节点");
          return false;
        }
        return pasteOutline(parent, text);
      }

      function deleteNode(node, { silent = false } = {}) {
        if (!canEdit()) return;
        const info = locate(node);
        if (!info || !info.parent) {
          if (!silent) toast("不能删除中心节点");
          return;
        }
        if (editing) commitEdit(true);
        hideCtxMenu();
        hideIconPop();
        pushHistory();
        const parent = info.parent;
        parent.children.splice(info.index, 1);
        refreshDepth(tree, 0);
        selected = parent;
        relayout(parent);
        saveLocal();
      }

      ctxMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        ignoreBlur = true;
      });
      ctxMenu.addEventListener("click", (event) => {
        const btn = event.target.closest("button[data-act]");
        if (!btn || btn.disabled) return;
        event.stopPropagation();
        const act = btn.getAttribute("data-act");
        hideCtxMenu();
        if (act === "rename") beginEdit(selected, "title");
        if (act === "desc") beginEdit(selected, "desc");
        if (act === "note") openNote(selected, { edit: true });
        if (act === "child") addChild(selected);
        if (act === "sibling") addSibling(selected);
        if (act === "copy") copyNode(selected);
        if (act === "cut") cutNode(selected);
        if (act === "paste") pasteNode(selected);
        if (act === "delete") deleteNode(selected);
        requestAnimationFrame(() => {
          ignoreBlur = false;
        });
      });

      notePop.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });
      document
        .getElementById("noteSave")
        .addEventListener("click", () => commitNote(true));
      document.getElementById("noteCancel").addEventListener("click", () => {
        hideNotePop({ save: false });
        draw();
      });
      noteEdit.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          document.getElementById("noteCancel").click();
        } else if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          commitNote(true);
        }
      });

      undoBtn.addEventListener("click", undo);
      redoBtn.addEventListener("click", redo);

      window.addEventListener("copy", (event) => {
        if (!canEdit() || !selected || !tree) return;
        if (clipboardUiBlocked()) return;
        if (editing || isTypingTarget(event.target)) return;
        event.preventDefault();
        const text = writeNodeClipboard(selected);
        event.clipboardData.setData("text/plain", text);
        toast("已复制");
      });

      window.addEventListener("cut", (event) => {
        if (!canEdit() || !selected || !tree) return;
        if (clipboardUiBlocked()) return;
        if (editing || isTypingTarget(event.target)) return;
        if (selected === tree) {
          event.preventDefault();
          toast("不能剪切中心节点");
          return;
        }
        event.preventDefault();
        const text = writeNodeClipboard(selected);
        event.clipboardData.setData("text/plain", text);
        deleteNode(selected, { silent: true });
        toast("已剪切");
      });

      window.addEventListener("paste", (event) => {
        if (!canEdit() || !selected || !tree) return;
        if (clipboardUiBlocked()) return;
        const inField = isTypingTarget(event.target);
        // Intercept outline paste on the canvas or while editing a node label;
        // leave other form fields alone.
        if (inField && !editing) return;
        const text = event.clipboardData
          ? event.clipboardData.getData("text/plain")
          : "";
        if (!looksLikeOutlinePaste(text)) return;
        event.preventDefault();
        nodeClipboardText = text;
        pasteOutline(selected, text);
      });

      window.addEventListener("keyup", (event) => {
        if (event.key === "Escape") escapeUsedForDrag = false;
      });
      window.addEventListener("blur", () => {
        escapeUsedForDrag = false;
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && (escapeUsedForDrag || cancelNodeDrag())) {
          escapeUsedForDrag = true;
          event.preventDefault();
          return;
        }
        if (iconPop.classList.contains("show") && event.key === "Escape") {
          event.preventDefault();
          hideIconPop();
          draw();
          return;
        }
        if (notePop.classList.contains("show") && event.key === "Escape") {
          event.preventDefault();
          if (noteEditing) document.getElementById("noteCancel").click();
          else hideNotePop({ save: false });
          return;
        }
        const mod = event.metaKey || event.ctrlKey;
        const chord = event.key.toLowerCase();
        if (
          mod &&
          !event.altKey &&
          !event.shiftKey &&
          !event.repeat &&
          !event.isComposing &&
          (chord === "s" || chord === "e" || chord === "i")
        ) {
          event.preventDefault();
          if (chord === "i") {
            if (confirmModal.classList.contains("show")) closeConfirm(false);
            if (downloadModal.classList.contains("show")) closeDownload();
            if (shareModal.classList.contains("show")) closeShare();
            if (!canEdit()) {
              toast("只读模式下不能导入");
              return;
            }
            uploadBtn.click();
            return;
          }
          if (downloadModal.classList.contains("show")) {
            confirmDownload();
            return;
          }
          if (confirmModal.classList.contains("show")) closeConfirm(false);
          if (shareModal.classList.contains("show")) closeShare();
          downloadBtn.click();
          return;
        }
        if (
          confirmModal.classList.contains("show") ||
          downloadModal.classList.contains("show") ||
          shareModal.classList.contains("show")
        ) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeConfirm(false);
            closeDownload();
            closeShare();
          }
          return;
        }
        if (mod && event.key.toLowerCase() === "z") {
          if (!canEdit()) return;
          event.preventDefault();
          if (event.shiftKey) redo();
          else undo();
          return;
        }
        if (mod && event.key.toLowerCase() === "y") {
          if (!canEdit()) return;
          event.preventDefault();
          redo();
          return;
        }
        const tag = event.target && event.target.tagName;
        const inField =
          tag === "INPUT" ||
          tag === "TEXTAREA" ||
          event.target.isContentEditable;
        if (
          mod &&
          !editing &&
          !inField &&
          (event.key === "=" ||
            event.key === "+" ||
            event.key === "-" ||
            event.key === "0" ||
            event.code === "NumpadAdd" ||
            event.code === "NumpadSubtract" ||
            event.code === "Numpad0")
        ) {
          event.preventDefault();
          if (event.key === "0" || event.code === "Numpad0") {
            frame();
            return;
          }
          const zoomIn =
            event.key === "=" ||
            event.key === "+" ||
            event.code === "NumpadAdd";
          const rect = svg.getBoundingClientRect();
          zoomAt(
            window.innerWidth / 2 - rect.left,
            window.innerHeight / 2 - rect.top,
            scale * (zoomIn ? 1.2 : 1 / 1.2),
          );
          apply();
          return;
        }
        if (editing) return;
        if (inField) return;
        if (modeSwitch.contains(event.target)) return;
        if (!selected && event.key !== "Escape") return;
        if (!canEdit()) {
          if (event.key === "Escape") {
            event.preventDefault();
            hideCtxMenu();
            selected = null;
            draw();
          }
          return;
        }
        if (event.key === "Tab") {
          event.preventDefault();
          addChild(selected);
        } else if (event.key === "Enter") {
          event.preventDefault();
          if (selected === tree) addChild(selected);
          else addSibling(selected);
        } else if (event.key === "F2") {
          event.preventDefault();
          beginEdit(selected);
        } else if (event.key === "Backspace" || event.key === "Delete") {
          event.preventDefault();
          deleteNode(selected);
        } else if (event.key === "Escape") {
          hideCtxMenu();
          selected = null;
          draw();
        }
      });

      function loadTree(
        next,
        name,
        keepOpen,
        { recordHistory = false, persist = true } = {},
      ) {
        if (editing) {
          editing = false;
          editInput = null;
          editBaseline = null;
        }
        if (recordHistory) pushHistory();
        tree = next;
        selected = null;
        if (name) {
          fileName = name
            .replace(/\.markdown$/i, ".md")
            .replace(/\.(opml|json|html|htm|xmind)$/i, ".md");
        }
        prepare(tree, keepOpen);
        const title = pageTitleOf(tree);
        document.title = title + " · mm";
        svg.setAttribute("aria-label", title);
        frame();
        if (persist) saveLocal();
        updateHistoryChrome();
      }

      function openImportConfirm(file) {
        pendingConfirm = { type: "import", file };
        confirmTitle.textContent = "覆盖当前导图？";
        confirmText.textContent = `导入「${file.name || "文件"}」将替换当前导图。可之后撤销。`;
        confirmOk.textContent = "覆盖导入";
        confirmModal.classList.add("show");
      }

      function openCloseConfirm() {
        pendingConfirm = { type: "close" };
        confirmTitle.textContent = "关闭当前文档？";
        confirmText.textContent =
          "将清除本地自动保存并重置为示例导图，此操作不可撤销。";
        confirmOk.textContent = "关闭";
        confirmModal.classList.add("show");
      }

      function closeConfirm(confirmed) {
        confirmModal.classList.remove("show");
        const pending = pendingConfirm;
        pendingConfirm = null;
        if (!confirmed || !pending) return;
        if (pending.type === "import" && pending.file) doImport(pending.file);
        else if (pending.type === "close") closeDocument();
      }

      function closeDocument() {
        hideCtxMenu();
        hideNotePop({ save: false });
        hideIconPop();
        shareGuest = false;
        shareExitDemo = false;
        clearShareVisit();
        syncShareBanner();
        clearShareParamsFromUrl();
        loadTree(cloneData(DEMO), "mindmap.md", true, { persist: false });
        history.clear();
        store.clear();
        updateHistoryChrome();
        syncModeSwitch();
        toast("已关闭");
      }

      function requestCloseDocument() {
        if (editing) commitEdit(true);
        if (noteEditing) commitNote(true);
        openCloseConfirm();
      }

      async function doImport(file) {
        try {
          const { tree: next } = await parseImportFile(file);
          loadTree(next, file.name || "outline.md", false, {
            recordHistory: true,
          });
          toast("已导入 " + (file.name || "文件"));
        } catch (error) {
          toast(error.message || String(error));
        }
      }

      async function requestImport(file) {
        if (!file) return;
        if (!canEdit()) {
          toast("只读模式下不能导入");
          return;
        }
        if (!isImportableFile(file)) {
          toast("请选择 Markdown / OPML / JSON / HTML / XMind 文件");
          return;
        }
        if (shouldConfirmOverwrite(tree)) openImportConfirm(file);
        else doImport(file);
      }

      function openDownload() {
        if (editing) commitEdit(true);
        if (noteEditing) commitNote(true);
        downloadName.value = (fileName || tree.title || "mindmap").replace(
          /\.(md|markdown|txt|html|xmind|opml|json)$/i,
          "",
        );
        setDownloadFormat("markdown");
        downloadModal.classList.add("show");
        downloadName.focus();
        downloadName.select();
      }

      function closeDownload() {
        downloadModal.classList.remove("show");
      }

      function confirmDownload() {
        try {
          const packed = buildDownload(
            tree,
            getDownloadFormat(),
            downloadName.value,
          );
          const blob = new Blob([packed.content], { type: packed.mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = packed.filename;
          a.click();
          URL.revokeObjectURL(url);
          fileName = packed.filename;
          saveLocal();
          closeDownload();
          toast("已导出 " + packed.filename);
        } catch (error) {
          toast(error.message || String(error));
        }
      }

      async function copyText(text) {
        const value = String(text || "");
        if (!value) return false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(value);
            return true;
          }
        } catch {
          /* fall through */
        }
        try {
          const area = document.createElement("textarea");
          area.value = value;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.select();
          const ok = document.execCommand("copy");
          area.remove();
          return ok;
        } catch {
          return false;
        }
      }

      function closeShare() {
        shareModal.classList.remove("show");
      }

      function syncShareModalFields() {
        shareLongUrl.value = shareLinks.longUrl || "";
        shareShortUrl.value = shareLinks.shortUrl || "";
        shareCopyShort.disabled = !shareLinks.shortUrl;
        const canNativeShare =
          typeof navigator.share === "function" &&
          !!(shareLinks.shortUrl || shareLinks.longUrl);
        shareSystem.hidden = !canNativeShare;
      }

      function applyShareResult(links) {
        shareLinks = {
          longUrl: links.longUrl || "",
          shortUrl: links.shortUrl || "",
        };
        shareLongUrl.placeholder = "";
        shareShortUrl.placeholder = shareLinks.shortUrl
          ? ""
          : shareLinks.longUrl.length > EXTERNAL_SHORTEN_MAX_LEN
            ? "导图过大，请用长链"
            : "短链不可用";
        syncShareModalFields();
        shareCopyLong.disabled = !shareLinks.longUrl;
        shareLongUrl.focus();
        shareLongUrl.select();
      }

      function rememberShare(snapshot, links) {
        shareOrigin = {
          snapshot,
          longUrl: links.longUrl || "",
          shortUrl: links.shortUrl || "",
        };
      }

      async function openShare() {
        if (editing) commitEdit(true);
        if (noteEditing) commitNote(true);
        shareLinks = { longUrl: "", shortUrl: "" };
        shareLongUrl.value = "";
        shareShortUrl.value = "";
        shareLongUrl.placeholder = "生成中…";
        shareShortUrl.placeholder = "生成中…";
        shareCopyLong.disabled = true;
        shareCopyShort.disabled = true;
        shareSystem.hidden = true;
        shareModal.classList.add("show");
        const snapshot = JSON.stringify(cloneData(tree));
        const reused = reuseUnchangedShare(shareOrigin, snapshot);
        if (reused) {
          applyShareResult(reused);
          return;
        }
        try {
          const result = await createShareLinks(tree, location.origin);
          rememberShare(snapshot, {
            longUrl: result.longUrl,
            shortUrl: result.shortUrl || "",
          });
          applyShareResult(shareOrigin);
        } catch (error) {
          shareLongUrl.placeholder = "生成失败";
          shareShortUrl.placeholder = "生成失败";
          shareCopyLong.disabled = true;
          toast(error.message || String(error));
        }
      }

      uploadBtn.addEventListener("click", () => {

      downloadBtn.addEventListener("click", () => {

      const fileMenu = document.getElementById("fileMenu");
