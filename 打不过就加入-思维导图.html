<script>
const tree = {"title":"打不过就加入","children":[{"title":"一、我的 AI 经验","children":[{"title":"开场","children":[{"title":"1. 打不过就加入","children":[{"title":"先讲我自己这些年怎么用 AI","children":[]},{"title":"再谈我对行业变化的判断","children":[]},{"title":"最后说企业可以怎样一步步用起来","children":[]}]}]},{"title":"我怎么用过来的","children":[{"title":"2. 二十年老程序员","children":[{"title":"下面讲的是我自己的实践，不是所有团队的情况","children":[]},{"title":"AI 已经进了日常，用到哪一步差很多","children":[]},{"title":"大家可以拿自己的做法来对照","children":[]}]},{"title":"3. 副驾驶，主驾驶，自动驾驶","children":[{"title":"副驾驶：当助手。业务代码我还逐段看、逐段改","children":[]},{"title":"主驾驶：整段任务交给它。我拆任务、做决定、查结果","children":[]},{"title":"自动驾驶：讲清目的地和要求。我验收，不盯每一步","children":[]},{"title":"安全、权限和真实数据，仍然要有验证和人工把关","children":[]},{"title":"团队协作我还没进入。先把判断写成 rules、skills、SOP","children":[]}]}]},{"title":"我现在的状态","children":[{"title":"4. 审美","children":[{"title":"以前追求简单，因为人力有限，人脑有限","children":[]},{"title":"写代码变便宜之后，简单还是好，但没那么要紧了","children":[]},{"title":"舍不得放手的是审美：刚好，才看得出力气用在哪","children":[]},{"title":"模型写得很长很全，代价可以低到几乎不计，说明不了它懂业务","children":[]},{"title":"我少从头写，多看这个结果在现有条件下能不能留下","children":[]}]},{"title":"5. 不看代码，看结果","children":[{"title":"这是工作重心变了，不是代码可以完全不查","children":[]},{"title":"低风险、范围清楚的改动，我更多看测试和实际效果","children":[]},{"title":"核心逻辑、数据、权限、生产环境，仍然要查","children":[]},{"title":"能放多少手，看任务风险和有没有办法验证","children":[]}]}]}]},{"title":"二、我的 AI 展望","children":[{"title":"一线已经先感到","children":[{"title":"6. 秋江水冷鸭先知","children":[{"title":"写软件的人，往往更早感到工具在变","children":[]},{"title":"不同公司、不同岗位，受到的影响并不一样","children":[]},{"title":"与其回避，不如先从手头的工作试起","children":[]},{"title":"弄清它能帮上什么，哪些还不能放心交给它","children":[]}]},{"title":"7. 老板还没定价，一线先感到压力","children":[{"title":"一线已经在试工具、改做法","children":[]},{"title":"怎么折进人力、预算和目标，往往还没形成共识","children":[]},{"title":"中间会有一个时间差","children":[]},{"title":"找一个具体场景，把省时、质量和成本讲清楚","children":[]}]}]},{"title":"活会怎么变","children":[{"title":"8. 不再逐行看完所有代码","children":[{"title":"生成变快了，人的审查时间没有同步增加","children":[]},{"title":"每处都逐行看，容易变成瓶颈；扫一眼，又容易变成形式","children":[]},{"title":"按风险分层：自动检查先拦一批，关键改动人来审","children":[]},{"title":"变的是质量保障怎么组合，不是取消审查，也不是把责任交给机器","children":[]}]},{"title":"9. 代码可以让它写，需求得讲清楚","children":[{"title":"AI 能出代码和初步方案，不知道我们真正要解决什么","children":[]},{"title":"业务目标、系统约束、验收标准，不能含糊地交给它猜","children":[]},{"title":"“更人性化一点”“大气一点”，这种话不够用","children":[]},{"title":"需求越清楚，验证越明确，结果才越接近预期","children":[]}]},{"title":"10. 模型能力还在变","children":[{"title":"不同模型、不同任务，进步速度并不一样","children":[]},{"title":"别用一次体验就下结论，重要场景值得重测","children":[]},{"title":"别把经验押在某个版本或一套提示词上","children":[]},{"title":"更值得留下的是业务知识、拆法、验收标准和流程","children":[]}]}]},{"title":"人和组织会怎么变","children":[{"title":"11. 一个人可以穿过更多环节","children":[{"title":"AI 让原来分散在不同岗位的部分工作，有了重新组合的可能","children":[]},{"title":"需求、设计、架构、质量这些能力还在，只是不一定还对应固定岗位","children":[]},{"title":"要重新看：哪些必须专人负责，哪些可以一个人贯通","children":[]},{"title":"哪些环节仍然要独立把关","children":[]}]},{"title":"12. 前后端分工没那么固定了","children":[{"title":"小而清楚的应用，一个人更容易做完从页面到接口的一段","children":[]},{"title":"大系统、复杂业务，专业分工仍然需要","children":[]},{"title":"变的是边界有弹性，不是岗位已经消失","children":[]},{"title":"开发时可以分细，维护时一个人贯通，也可能够用","children":[]}]},{"title":"13. 别把一种分工定死","children":[{"title":"模型和业务都在变，一种分工不是长期答案","children":[]},{"title":"灵活不是今天换工具、明天推翻架构","children":[]},{"title":"模型、工具、流程留出替换空间；稳定和合规要有变更机制","children":[]},{"title":"先在小团队试，验证了再推广","children":[]}]}]}]},{"title":"三、我的 AI 建议（企业如何采用）","children":[{"title":"先看加入有多深","children":[{"title":"14. 投名状","children":[{"title":"接下来的问题：企业应该怎么采用 AI","children":[]},{"title":"起点不一样，都很正常","children":[]},{"title":"买工具、个人用、交出一个环节、重做流程，是不同深度","children":[]},{"title":"先看自己在哪一步，再找一个值得验证的场景","children":[]}]},{"title":"15. 一层一层往下","children":[{"title":"买工具：先让团队有得用","children":[]},{"title":"个人用：个人可能更快，团队主流程还没变","children":[]},{"title":"交出一个环节：AI 做执行，人定要求、做验收","children":[]},{"title":"串起流程：环节之间能流转，并带上权限、验证和异常处理","children":[]},{"title":"AI Native：设计流程时就想好 AI 承担什么，人仍负责目标和结果","children":[]}]}]},{"title":"目标是 AI Native","children":[{"title":"16. AI Native","children":[{"title":"不是给原来的流程加一个 AI 按钮","children":[]},{"title":"从一开始就想：哪些步骤交给它，哪些要人判断","children":[]},{"title":"异常时怎样接管，也要设计进去","children":[]},{"title":"它是方向，不是所有场景都能照搬的模板","children":[]}]},{"title":"17. 哪些交给 AI，哪些人把关","children":[{"title":"AI 多做执行和整理，人把精力放在目标、判断和验收","children":[]},{"title":"需求、设计、开发、测试、运维，都可以先出初稿","children":[]},{"title":"优先级、架构、安全和发布判断，仍然要人负责","children":[]},{"title":"回滚、修数据这类高风险操作，要有审批和权限","children":[]}]},{"title":"18. 怎么让 AI 不跑偏","children":[{"title":"任务要明确：目标、上下文、输入、验收标准","children":[]},{"title":"按任务选模型和工具，调用要安全","children":[]},{"title":"用测试、规则和抽查验证，不能只信它自己","children":[]},{"title":"哪些数据能用、哪些操作必须人批，事先说清","children":[]},{"title":"能停、能退，复盘之后再改流程","children":[]}]}]},{"title":"把 AI 用好：模型、领域知识和标准","children":[{"title":"19. 先用强模型摸清边界","children":[{"title":"先用强模型看这个任务能做到什么程度","children":[]},{"title":"别把工具的限制，误判成 AI 本身做不到","children":[]},{"title":"真正用的时候，再算准确率、成本、延迟和数据政策","children":[]},{"title":"简单、重复、验证过的任务，可以换更经济的模型","children":[]}]},{"title":"20. 多串模型，少抠 prompt","children":[{"title":"提示词有用，但别把主要精力放在收集技巧上","children":[]},{"title":"先把业务任务拆开，再看每一步要什么能力","children":[]},{"title":"有时一个模型就够，有时才值得多个配合","children":[]},{"title":"只有效果提得出来，编排才有价值","children":[]}]},{"title":"21. 按任务选，算综合成本","children":[{"title":"图片、长文档、代码，要的能力不一样","children":[]},{"title":"用自己的任务测，别只凭印象或榜单","children":[]},{"title":"成本要算等待、失败、人工校对和返工","children":[]},{"title":"便宜但经常出错，最后未必更省","children":[]}]},{"title":"22. 领域知识越好，AI 用得越好","children":[{"title":"你懂问题，才知道该给它哪些背景","children":[]},{"title":"你懂系统和规则，才看得出方案有没有漏","children":[]},{"title":"你懂质量要求，才判断得了结果能不能用","children":[]},{"title":"AI 能帮忙补知识，替不了业务判断","children":[]}]},{"title":"23. 不写代码，能力从哪来","children":[{"title":"代码可以多由 AI 写，对系统的理解不能一起外包","children":[]},{"title":"有时仍要自己动手：做实验、拆模块、定位问题","children":[]},{"title":"过去动手，主要是为了交付","children":[]},{"title":"以后有一部分动手，是为了校准判断、验证它的结果","children":[]}]},{"title":"24. 别什么都直接塞给 AI","children":[{"title":"有了 AI，不等于什么都能直接丢给它","children":[]},{"title":"自己先得有比较清晰的思路","children":[]},{"title":"可以先用脑图这类工具，把大纲理出来","children":[]},{"title":"再把大纲交给它：整理、扩展，生成幻灯片","children":[]}]},{"title":"25. 别说大气一点","children":[{"title":"形容词能表方向，指导不了具体工作","children":[]},{"title":"要说清给谁用、先完成什么、信息怎么排","children":[]},{"title":"错误怎么提示，小屏幕上怎么排，也要说","children":[]},{"title":"把判断写成例子和标准，它才更可能做对","children":[]}]}]},{"title":"验证要严，放手看阶段","children":[{"title":"26. 生成得快，验证和修复也要跟上","children":[{"title":"初稿变快，不等于交付变快","children":[]},{"title":"生产快：控制范围，一次别生成太多、难以检查","children":[]},{"title":"验证严：能自动的检查先自动，高风险改动仍要人审","children":[]},{"title":"修复快：小批量发布，能监控，能回滚","children":[]}]},{"title":"27. 先看任务，再决定放多少手","children":[{"title":"边写边确认的助手，和后台连续执行的 Agent，适合的任务不一样","children":[]},{"title":"刚试一个场景时，先出建议和初稿，人逐步确认","children":[]},{"title":"边界清楚、结果好查、异常能处理，再加大自动范围","children":[]},{"title":"风险越高，人工确认和回退越重要","children":[]}]}]},{"title":"背着债也能走","children":[{"title":"28. 背着历史债务","children":[{"title":"多数团队不是一张白纸，不可能一下子从头来","children":[]},{"title":"缺文档、缺测试，关键知识往往在少数人手里","children":[]},{"title":"AI 不了解系统就大改，可能把原有问题放大","children":[]},{"title":"先看清现状和风险，别把全面接入当成第一步","children":[]}]},{"title":"29. 新的和老的，两条线","children":[{"title":"新项目从设计时就想好 AI 怎么参与，并把测试、权限、日志和验收一起设计","children":[]},{"title":"老系统先补最要命的底座：关键测试、日志、监控、发布和回滚","children":[]},{"title":"不用等所有历史问题都解决了才用 AI","children":[]},{"title":"边治理，边选低风险的场景试","children":[]}]},{"title":"30. 历史债，也让 AI 干","children":[{"title":"补文档、理调用关系、补测试，可以先让它做一轮","children":[]},{"title":"先从只读分析、文档整理和低风险测试开始","children":[]},{"title":"它可能把现有错误当成正确行为","children":[]},{"title":"关键结论要熟悉业务的人确认","children":[]}]},{"title":"31. 能改的改，不适合的干掉","children":[{"title":"不是所有旧流程都要推倒重来","children":[]},{"title":"逐项看：这道流程现在解决什么问题","children":[]},{"title":"只是重复搬运信息的，可以合并或取消","children":[]},{"title":"涉及资金、隐私、安全和生产数据的确认，不能按“效率低”删掉","children":[]}]}]},{"title":"别走歪","children":[{"title":"32. 五个坑","children":[{"title":"工具崇拜：买了，不代表问题解决了","children":[]},{"title":"KPI 化：使用次数和开通率，不等于效率提升","children":[]},{"title":"跳过基本功：没有测试和评审，只是更快地出问题","children":[]},{"title":"只做 Demo：演示好，不等于能进真实业务","children":[]},{"title":"忽视安全：哪些代码和数据能交出去，权限有多大，要先说清","children":[]}]},{"title":"33. 先改流程，再选工具","children":[{"title":"先看流程哪里有问题，再决定 AI 放在哪一步","children":[]},{"title":"生成、自动检查、人审关键改动、上线后观察","children":[]},{"title":"出了问题要能定位、回滚，再反馈到需求和测试","children":[]},{"title":"不一定先买新平台，先把这条链连起来","children":[]}]}]},{"title":"渐进，别跳","children":[{"title":"34. 90 天，先跑通一个小闭环","children":[{"title":"选场景：高频、痛点清楚、风险可控、效果能衡量","children":[]},{"title":"做小试点，开始前先记下现在的做法和耗时","children":[]},{"title":"看时间、质量、返工、校对和成本","children":[]},{"title":"复盘：真正省下的是时间，还是把活转给了审核的人","children":[]},{"title":"有效再推广；数据和责任，试点前就说清","children":[]}]},{"title":"35. 一步步来，别跳","children":[{"title":"从个人使用，到小组，再到团队，最后才是组织机制","children":[]},{"title":"先改一小段流程，用指标看结果，再决定要不要扩大","children":[]},{"title":"别一开始就要求全公司统一用某个工具","children":[]},{"title":"Agent 可以试，先从边界清楚、容易验证的任务开始","children":[]}]},{"title":"36. 摸着石头过河，别瞎指挥","children":[{"title":"没有一套所有企业都能照搬的答案","children":[]},{"title":"从小场景开始：先做、先测、再调整","children":[]},{"title":"管理层先弄清一线怎么用，能力和限制在哪","children":[]},{"title":"自己还没搞明白，就别急着下指令","children":[]}]},{"title":"37. 先画边界，再开工","children":[{"title":"场景：任务清不清楚，错了影响多大，谁负责","children":[]},{"title":"基线：现在花多少时间，质量怎样","children":[]},{"title":"安全：哪些数据能用，哪些操作必须人确认","children":[]},{"title":"复盘：省了多少时间，质量、返工和成本有没有变","children":[]}]},{"title":"38. 各管一块","children":[{"title":"产品和业务：说清问题、目标和验收，并确认符不符合真实业务","children":[]},{"title":"研发：守住测试、工具链、权限和验证","children":[]},{"title":"技术负责人：定试点范围和风险边界，看结果再调","children":[]},{"title":"管理层：给试错空间，看业务结果，别只考核使用次数","children":[]}]},{"title":"39. 你们先试哪一个","children":[{"title":"最想让 AI 接手的一个环节是什么","children":[]},{"title":"最大的顾虑是数据安全、结果质量，还是投入产出不好算","children":[]},{"title":"如果先做一个月，用什么指标判断有没有价值","children":[]}]}]},{"title":"收束","children":[{"title":"40. 把一个环节交给 AI","children":[{"title":"别停在开通工具，去找适合交出去的任务","children":[]},{"title":"AI Native 是重新设计工作，不是让 AI 包办一切","children":[]},{"title":"判断和结果责任，仍然在人","children":[]},{"title":"回去试一个具体、重复、边界清楚的环节","children":[]}]},{"title":"41. 谢谢","children":[{"title":"欢迎提问","children":[]},{"title":"也欢迎交流各自团队的实际做法","children":[]}]}]}]}]};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const viewport = document.createElementNS(NS, "g");
svg.appendChild(viewport);

const GAP_X = 56;
const GAP_Y = 18;
const song = '"Songti SC", "STSongti-SC-Regular", "Noto Serif SC", serif';
const sans = '"PingFang SC", "Hiragino Sans GB", sans-serif';
const styles = [
  { size: 30, weight: 700, family: song, fill: "#111", h: 46 },
  { size: 22, weight: 700, family: song, fill: "#111", h: 38 },
  { size: 17, weight: 600, family: song, fill: "#111", h: 34 },
  { size: 15, weight: 500, family: sans, fill: "#111", h: 30 },
  { size: 14, weight: 400, family: sans, fill: "#333", h: 28 },
];

function walk(node, depth, visit) {
  visit(node, depth);
  node.children.forEach((child) => walk(child, depth + 1, visit));
}
walk(tree, 0, (node, depth) => {
  node.depth = depth;
  node.open = depth < 3;
});

const measureCanvas = document.createElement("canvas").getContext("2d");
function textWidth(text, font) {
  measureCanvas.font = font;
  return Math.ceil(measureCanvas.measureText(text).width);
}

function layout(node) {
  const depth = Math.min(node.depth, styles.length - 1);
  node.style = styles[depth];
  node.h = node.style.h;
  node.labelW = textWidth(node.title, node.style.weight + " " + node.style.size + "px " + node.style.family);
  node.hasChildren = node.children.length > 0;
  node.marker = node.hasChildren && !node.open ? node.children.length : 0;
  node.markerW = node.hasChildren ? 24 + (node.marker ? textWidth(String(node.marker), "400 13px " + sans) + 8 : 0) : 0;
  node.w = node.labelW + node.markerW;
  if (!node.open || !node.hasChildren) {
    node.subtreeH = node.h;
    return;
  }
  node.children.forEach(layout);
  const inner = node.children.reduce((sum, child) => sum + child.subtreeH, 0) + GAP_Y * (node.children.length - 1);
  node.subtreeH = Math.max(node.h, inner);
}

function place(node, x, top) {
  node.x = x;
  if (!node.open || !node.hasChildren) {
    node.y = top + (node.subtreeH - node.h) / 2;
    return;
  }
  const inner = node.children.reduce((sum, child) => sum + child.subtreeH, 0) + GAP_Y * (node.children.length - 1);
  let y = top + (node.subtreeH - inner) / 2;
  node.children.forEach((child) => {
    place(child, x + node.w + GAP_X, y);
    y += child.subtreeH + GAP_Y;
  });
  const first = node.children[0];
  const last = node.children[node.children.length - 1];
  const mid = (first.y + first.h / 2 + last.y + last.h / 2) / 2;
  node.y = mid - node.h / 2;
}

let tx = 48;
let ty = 36;
let scale = 1;

function draw() {
  viewport.replaceChildren();
  const links = document.createElementNS(NS, "g");
  const nodes = document.createElementNS(NS, "g");
  viewport.append(links, nodes);
  function visit(node) {
    if (node.open) {
      node.children.forEach((child) => {
        const x1 = node.x + node.w;
        const y1 = node.y + node.h / 2;
        const x2 = child.x;
        const y2 = child.y + child.h / 2;
        const bend = Math.max(20, (x2 - x1) * 0.46);
        const path = document.createElementNS(NS, "path");
        path.setAttribute("d", "M " + x1 + " " + y1 + " C " + (x1 + bend) + " " + y1 + ", " + (x2 - bend) + " " + y2 + ", " + x2 + " " + y2);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#111");
        path.setAttribute("stroke-width", node.depth === 0 ? 1.6 : 1);
        links.appendChild(path);
        visit(child);
      });
    }
    const group = document.createElementNS(NS, "g");
    group.setAttribute("data-id", node.title + "@" + node.depth + "@" + node.x);
    group.style.cursor = node.hasChildren ? "pointer" : "default";
    const hit = document.createElementNS(NS, "rect");
    hit.setAttribute("x", node.x - 8);
    hit.setAttribute("y", node.y);
    hit.setAttribute("width", node.w + 16);
    hit.setAttribute("height", node.h);
    hit.setAttribute("fill", "transparent");
    group.appendChild(hit);
    const label = document.createElementNS(NS, "text");
    label.setAttribute("x", node.x);
    label.setAttribute("y", node.y + node.h / 2);
    label.setAttribute("dominant-baseline", "central");
    label.setAttribute("fill", node.style.fill);
    label.setAttribute("font-family", node.style.family);
    label.setAttribute("font-size", node.style.size);
    label.setAttribute("font-weight", node.style.weight);
    label.textContent = node.title;
    group.appendChild(label);
    if (node.hasChildren) {
      const mx = node.x + node.labelW + 16;
      const my = node.y + node.h / 2;
      const mark = document.createElementNS(NS, "circle");
      mark.setAttribute("cx", mx);
      mark.setAttribute("cy", my);
      mark.setAttribute("r", 7);
      mark.setAttribute("fill", "#fff");
      mark.setAttribute("stroke", "#111");
      mark.setAttribute("stroke-width", 1.2);
      group.appendChild(mark);
      const hline = document.createElementNS(NS, "path");
      hline.setAttribute("d", "M " + (mx - 3.2) + " " + my + " H " + (mx + 3.2));
      hline.setAttribute("stroke", "#111");
      hline.setAttribute("stroke-width", 1.2);
      hline.setAttribute("fill", "none");
      group.appendChild(hline);
      if (!node.open) {
        const vline = document.createElementNS(NS, "path");
        vline.setAttribute("d", "M " + mx + " " + (my - 3.2) + " V " + (my + 3.2));
        vline.setAttribute("stroke", "#111");
        vline.setAttribute("stroke-width", 1.2);
        vline.setAttribute("fill", "none");
        group.appendChild(vline);
      }
      if (node.marker) {
        const count = document.createElementNS(NS, "text");
        count.setAttribute("x", mx + 14);
        count.setAttribute("y", my);
        count.setAttribute("dominant-baseline", "central");
        count.setAttribute("fill", "#888");
        count.setAttribute("font-family", sans);
        count.setAttribute("font-size", 13);
        count.setAttribute("font-weight", 400);
        count.textContent = String(node.marker);
        group.appendChild(count);
      }
    }
    group.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
      armDrag(event, node);
    });
    nodes.appendChild(group);
  }
  visit(tree);
  apply();
}

function apply() {
  viewport.setAttribute("transform", "translate(" + tx + " " + ty + ") scale(" + scale + ")");
}

function relayout(anchor) {
  const before = anchor ? anchor.y : 0;
  layout(tree);
  place(tree, 0, 0);
  if (anchor) ty += (before - anchor.y) * scale;
  draw();
}

let drag = null;
function armDrag(event, node) {
  drag = { x: event.clientX, y: event.clientY, tx, ty, moved: false, node };
  svg.setPointerCapture(event.pointerId);
}
svg.addEventListener("pointerdown", (event) => armDrag(event, null));
svg.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  svg.classList.add("dragging");
  tx = drag.tx + dx;
  ty = drag.ty + dy;
  apply();
});
function endDrag() {
  if (drag && !drag.moved && drag.node && drag.node.hasChildren) {
    drag.node.open = !drag.node.open;
    relayout(drag.node);
  }
  drag = null;
  svg.classList.remove("dragging");
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", () => { drag = null; svg.classList.remove("dragging"); });
svg.addEventListener("wheel", (event) => {
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) {
    const next = Math.min(2.4, Math.max(0.35, scale * (event.deltaY < 0 ? 1.08 : 0.92)));
    const rect = svg.getBoundingClientRect();
    const px = event.clientX - rect.left;
    const py = event.clientY - rect.top;
    tx = px - ((px - tx) * next) / scale;
    ty = py - ((py - ty) * next) / scale;
    scale = next;
  } else {
    tx -= event.deltaX;
    ty -= event.deltaY;
  }
  apply();
}, { passive: false });

function bounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  (function scan(node) {
    minX = Math.min(minX, node.x);
    minY = Math.min(minY, node.y);
    maxX = Math.max(maxX, node.x + node.w);
    maxY = Math.max(maxY, node.y + node.h);
    if (node.open) node.children.forEach(scan);
  })(tree);
  return { minX, minY, w: maxX - minX, h: maxY - minY };
}
function frame(anchor) {
  layout(tree);
  place(tree, 0, 0);
  const box = bounds();
  const pad = 40;
  if (!anchor) {
    const fitW = (window.innerWidth - pad * 2) / box.w;
    const fitH = (window.innerHeight - pad * 2) / box.h;
    const fit = Math.min(fitW, fitH);
    scale = Math.min(1, fit >= 0.78 ? fit : fitW);
    tx = (window.innerWidth - box.w * scale) / 2 - box.minX * scale;
    const fittedH = box.h * scale;
    ty = fittedH < window.innerHeight - pad
      ? (window.innerHeight - fittedH) / 2 - box.minY * scale
      : window.innerHeight / 2 - (tree.y + tree.h / 2) * scale;
  }
  draw();
}
frame(null);
window.addEventListener("resize", () => frame(null));
</script>
</body>
